<title>英語チャンク1000</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top) 16px 24px;
  }
  header { width: 100%; max-width: 480px; padding: 16px 0 8px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .stats { font-size: 13px; color: #94a3b8; display: flex; justify-content: center; gap: 16px; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; width: 100%; max-width: 480px; }
  .tab { flex: 1; padding: 10px; border-radius: 10px; background: #1e293b; text-align: center;
    font-size: 14px; cursor: pointer; border: 1px solid #334155; }
  .tab.active { background: #2563eb; border-color: #2563eb; }
  .card-wrap { width: 100%; max-width: 480px; margin-top: 8px; }
  .card {
    background: #1e293b; border-radius: 20px; padding: 32px 24px; min-height: 220px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); cursor: pointer;
    border: 1px solid #334155;
  }
  .card .en { font-size: 24px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .card .ja { font-size: 17px; color: #93c5fd; line-height: 1.5; }
  .card .hint { font-size: 12px; color: #64748b; margin-top: 16px; }
  .no-badge { font-size: 12px; color: #64748b; margin-bottom: 8px; }
  .buttons { display: flex; gap: 10px; margin-top: 16px; width: 100%; max-width: 480px; }
  .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-wrong { background: #dc2626; color: white; }
  .btn-correct { background: #16a34a; color: white; }
  .btn:disabled { opacity: 0.3; }
  .progress-bar { width: 100%; max-width: 480px; height: 6px; background: #1e293b; border-radius: 3px; margin-top: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: #2563eb; transition: width 0.3s; }
  .empty { text-align: center; color: #64748b; padding: 60px 20px; }
  .reset-btn { margin-top: 24px; font-size: 12px; color: #64748b; background: none; border: none; text-decoration: underline; cursor: pointer; }
  table.list { width: 100%; max-width: 480px; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.list th, table.list td { padding: 8px 6px; border-bottom: 1px solid #334155; text-align: left; }
  table.list th { color: #64748b; font-weight: 500; position: sticky; top: 0; background: #0f172a; }
  .status-badge { padding: 2px 8px; border-radius: 8px; font-size: 11px; }
  .st-未学習 { background: #475569; }
  .st-学習中 { background: #b45309; }
  .st-復習中 { background: #1d4ed8; }
  .st-習得済み { background: #15803d; }
  .list-wrap { width: 100%; max-width: 480px; max-height: 70vh; overflow-y: auto; }
</style>
</head>
<body>
<header>

<div class="card-wrap" id="quizArea"></div>

</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="list-wrap" id="listArea" style="display:none;"></div>

<button class="reset-btn" id="resetBtn">進捗をすべてリセット</button>

t","ja":"考え抜く"},{"id":975,"en":"think over","ja":"よく考える"},{"id":976,"en":"think through","ja":"じっくり考える"},{"id":977,"en":"think up","ja":"考え出す"},{"id":978,"en":"turn around","ja":"①振り返る ②好転させる"},{"id":979,"en":"turn away","ja":"①目をそむける ②追い返す"},{"id":980,"en":"turn back","ja":"引き返す"},{"id":981,"en":"turn down","ja":"①(音量/温度を)下げ・断る"},{"id":982,"en":"turn in","ja":"①提出する ②寝る"},{"id":983,"en":"turn into","ja":"①変わる ②変身する"},{"id":984,"en":"turn off","ja":"①消す ②別の道路に入る"},{"id":985,"en":"turn on","ja":"つける"},{"id":986,"en":"turn over","ja":"①ひっくり返す ②引き渡す"},{"id":987,"en":"turn up","ja":"①(音量/温度を)上げる ②現れる"},{"id":988,"en":"wear down","ja":"①すり減る ②徐々に疲れ果てさせる"},{"id":989,"en":"wear in","ja":"着てなじませる"},{"id":990,"en":"wear off","ja":"①なくなる ②薄れる"},{"id":991,"en":"wear out","ja":"①使い古す ②疲れ果てさせる"},{"id":992,"en":"wear over","ja":"の上にもう着る"},{"id":993,"en":"wear through","ja":"すり減って穴が開く"},{"id":994,"en":"work in","ja":"①で働く ②組み込む"},{"id":995,"en":"work off","ja":"①解消する ②働いて返済する"},{"id":996,"en":"work on","ja":"取り組む"},{"id":997,"en":"work out","ja":"①和解する ②運動する・筋トレする"},{"id":998,"en":"work over","ja":"①やり直す ②殴りつける"},{"id":999,"en":"work through","ja":"①を通じてずっと働く ②取り組む"},{"id":1000,"en":"work up","ja":"①興奮する ②奮い起こす"}];

const STORAGE_KEY = 'chunk_progress_v1';
const INTERVALS = [1, 3, 7, 14, 30, 90]; // days

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const initial = {};
  CHUNKS.forEach(c => {
    initial[c.id] = { status: '未学習', review_count: 0, last_reviewed: null, next_review: null, box: 0 };
  });
  return initial;
}

function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

let progress = loadProgress();
let currentTab = 'quiz';
let currentCard = null;
let revealed = false;
let queue = [];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function addDays(dateStr, days) {
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function buildQueue(mode) {
  const today = todayStr();
  if (mode === 'quiz') {
    // due for review: next_review <= today, or 未学習
    queue = CHUNKS.filter(c => {
      const p = progress[c.id];
      if (!p) return true;
      if (p.status === '未学習') return true;
      if (p.status === '習得済み') return false;
      return !p.next_review || p.next_review <= today;
    });
  } else {
    queue = [...CHUNKS];
  }
  // shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
}

function updateStats() {
  const counts = { '未学習': 0, '学習中': 0, '復習中': 0, '習得済み': 0 };
  Object.values(progress).forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
  document.getElementById('stats').innerHTML =
    `<span>未学習 ${counts['未学習']}</span><span>習得済み ${counts['習得済み']}</span><span>復習待ち ${queueDueCount()}</span>`;
}

function queueDueCount() {
  const today = todayStr();
  return CHUNKS.filter(c => {
    const p = progress[c.id];
    if (!p || p.status === '未学習') return true;
    if (p.status === '習得済み') return false;
    return !p.next_review || p.next_review <= today;
  }).length;
}

function renderCard() {
  const area = document.getElementById('quizArea');
  const btns = document.getElementById('quizButtons');
  if (queue.length === 0) {
    area.innerHTML = `<div class="empty">🎉 今日の分は終わりました！<br>お疲れ様でした。</div>`;
    btns.style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    return;
  }
  currentCard = queue[0];
  revealed = false;
  const p = progress[currentCard.id] || { status: '未学習', box: 0 };
  area.innerHTML = `
    <div class="no-badge">No.${currentCard.id} ・ ${p.status}</div>
    <div class="card" id="flashcard">
      <div class="en">${currentCard.en}</div>
      <div class="ja" id="jaText" style="display:none;">${currentCard.ja}</div>
      <div class="hint" id="hintText">タップして意味を表示</div>
    </div>
  `;
  btns.style.display = 'none';
  document.getElementById('flashcard').onclick = () => {
    revealed = true;
    document.getElementById('jaText').style.display = 'block';
    document.getElementById('hintText').style.display = 'none';
    btns.style.display = 'flex';
  };
  const total = currentTab === 'quiz' ? queueDueCount() : CHUNKS.length;
  const remaining = queue.length;
  const done = total - remaining;
  document.getElementById('progressFill').style.width = `${total ? (done/total*100) : 0}%`;
}

function markResult(correct) {
  if (!currentCard) return;
  const p = progress[currentCard.id] || { status: '未学習', review_count: 0, box: 0 };
  p.review_count = (p.review_count || 0) + 1;
  p.last_reviewed = todayStr();
  if (correct) {
    p.box = Math.min((p.box || 0) + 1, INTERVALS.length - 1);
    p.status = p.box >= INTERVALS.length - 1 ? '習得済み' : (p.box >= 2 ? '復習中' : '学習中');
    p.next_review = addDays(todayStr(), INTERVALS[p.box]);
  } else {
    p.box = 0;
    p.status = '学習中';
    p.next_review = addDays(todayStr(), INTERVALS[0]);
  }
  progress[currentCard.id] = p;
  saveProgress(progress);
  queue.shift();
  updateStats();
  renderCard();
}

function renderList() {
  const area = document.getElementById('listArea');
  let rows = CHUNKS.map(c => {
    const p = progress[c.id] || { status: '未学習', review_count: 0 };
    return `<tr><td>${c.id}</td><td>${c.en}</td><td>${c.ja}</td><td><span class="status-badge st-${p.status}">${p.status}</span></td></tr>`;
  }).join('');
  area.innerHTML = `<table class="list"><thead><tr><th>No</th><th>チャンク</th><th>意味</th><th>状態</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const quizArea = document.getElementById('quizArea');
  const quizButtons = document.getElementById('quizButtons');
  const listArea = document.getElementById('listArea');
  const progressBar = document.querySelector('.progress-bar');

  if (tab === 'list') {
    quizArea.style.display = 'none';
    quizButtons.style.display = 'none';
    progressBar.style.display = 'none';
    listArea.style.display = 'block';
    renderList();
  } else {
    quizArea.style.display = 'flex';
    listArea.style.display = 'none';
    progressBar.style.display = 'block';
    buildQueue(tab === 'quiz' ? 'quiz' : 'random');
    renderCard();
    updateStats();
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});
document.getElementById('btnCorrect').addEventListener('click', () => markResult(true));
document.getElementById('btnWrong').addEventListener('click', () => markResult(false));
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('本当に全ての学習進捗をリセットしますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    progress = loadProgress();
    switchTab(currentTab);
  }
});

switchTab('quiz');
</script>
