  .copy-btn { background: #2563eb; color: white; }
  .close-btn { background: #334155; color: #e2e8f0; }

</head>
<body>
<header>
  <h1>📚 英語チャンク1000</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="tabs">

</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="list-wrap" id="listArea" style="display:none;"></div>

<button class="export-btn" id="exportBtn">📤 進捗をエクスポート（Obsidianに反映用）</button>
<button class="reset-btn" id="resetBtn">進捗をすべてリセット</button>

<div class="export-modal" id="exportModal">
  <div class="export-box">
    <h3>📤 進捗データのエクスポート</h3>

    <textarea class="export-textarea" id="exportText" readonly></textarea>
    <div class="export-actions">
      <button class="copy-btn" id="copyBtn">コピーする</button>
      <button class="close-btn" id="closeExportBtn">閉じる</button>
    </div>
  </div>
</div>

<div class="detail-modal" id="detailModal">
  <div class="detail-box" id="detailBox"></div>
</div>

const EXAMPLES = [{"id":1,"en":"\"**What's up?**\" Toyo-chan asked me this morning.","ja":"「元気？」と今朝とよちゃんが聞いてきた。","chunks":[1]},{"id":2,"en":"\"**Not much**,\" I said. \"**How's it going?**\"","ja":"「別に」と私は言った。「調子はどう？」","chunks":[2,3]},{"id":3,"en":"I feel **pretty good** today.","ja":"今日はまあまあ調子がいい。","chunks":[4]},{"id":4,"en":"**I see**, the mayor wants a report tomorrow.","ja":"なるほど、市長は明日の報告を求めている。","chunks":[5]},{"id":5,"en":"**I swear** I did not lose the golf score card.","ja":"誓って言うけど、ゴルフのスコアカードは無くしていない。","chunks":[6]},{"id":6,"en":"I have **good news**: the J-League camp talks are moving forward.","ja":"良いニュースがある。Jリーグのキャンプ誘致の話が進んでいる。","chunks":[7]},{"id":7,"en":"**Uh-oh**, I forgot Nutz's walk again.","ja":"あーあ、またナッツの散歩を忘れた。","chunks":[8]},{"id":8,"en":"**Be careful** on the golf course, there was a scary guy in the parking lot.","ja":"ゴルフ場では気をつけて、駐車場に怖い人がいたから。","chunks":[9]},{"id":9,"en":"**Watch out!** Nutz almost ran into the road.","ja":"危ない！ナッツが道路に飛び出しそうだった。","chunks":[10]},{"id":10,"en":"**That's it!** I finally fixed the report for the mayor.","ja":"それだ！市長への報告書をやっと直せた。","chunks":[11]},{"id":11,"en":"**That works for me**, let's play golf on Saturday.","ja":"それでいいよ、土曜日にゴルフをしよう。","chunks":[12]},{"id":12,"en":"**That sucks**, my golf score was terrible today.","ja":"最悪だね、今日のゴルフスコアはひどかった。","chunks":[13]},{"id":13,"en":"**Cheer up**, Toyo-chan, your first birdie will come soon.","ja":"元気出して、とよちゃん、初バーディーはすぐ来るよ。","chunks":[14]},{"id":14,"en":"**Never mind**, Sae already texted me back.","ja":"気にしないで、咲英からもう返信が来た。","chunks":[15]},{"id":15,"en":"**Nice one**! Toyo-chan got her first birdie ever.","ja":"いいね！とよちゃんが人生初のバーディーを取った。","chunks":[16]},{"id":16,"en":"**Guess what?** Sae is coming home for the first time in a year.","ja":"ねぇ聞いて、咲英が1年ぶりに帰省するんだ。","chunks":[17]},{"id":17,"en":"**Who cares** if the golf bag is old and worn out?","ja":"ゴルフバッグが古くてボロボロでも別にいいじゃないか。","chunks":[18]},{"id":18,"en":"**Why not** go to the summer festival with Toyo-chan?","ja":"とよちゃんと夏祭りに行かない理由がある？もちろん行こう。","chunks":[19]},{"id":19,"en":"**It depends** on the weather whether we play golf tomorrow.","ja":"明日ゴルフをするかは天気次第だ。","chunks":[20]},{"id":20,"en":"**Same here**, I also love Jingisukan from Hinode Shokuhin.","ja":"私も同じ、日の出食品のジンギスカンが大好き。","chunks":[21]},{"id":21,"en":"**Fair enough**, the manager was strict, but I understand his position.","ja":"わかった、その管理者は厳しかったけど立場は理解できる。","chunks":[22]},{"id":22,"en":"The two golf scores were **close enough**, 107 and 109.","ja":"107と109、2人のスコアは大体同じだった。","chunks":[23]},{"id":23,"en":"**Of course** I will go to the mayor's meeting tomorrow.","ja":"もちろん明日の市長との会議には行くよ。","chunks":[24]},{"id":24,"en":"**No doubt** Nutz missed Sae while she was in England.","ja":"咲英がイギリスにいる間、ナッツは間違いなく寂しがっていた。","chunks":[25]},{"id":25,"en":"**No way!** Toyo-chan really got a birdie?","ja":"嘘！とよちゃんが本当にバーディーを取ったの？","chunks":[26]},{"id":26,"en":"I **have no idea** why the stadium manager was so upset.","ja":"競技場の管理者がなぜあんなに怒っていたのか全然わからない。","chunks":[27]},{"id":27,"en":"**No worries**, I will handle the Marinos hotel quote.","ja":"心配しないで、マリノスのホテル見積もりは私がやる。","chunks":[28]},{"id":28,"en":"**Got it**, I'll pick up Sae at the airport.","ja":"わかった、咲英を空港まで迎えに行くよ。","chunks":[29]},{"id":29,"en":"It **makes sense** that the golf course was crowded on Saturday.","ja":"土曜日にゴルフ場が混んでいたのは納得できる。","chunks":[30]},{"id":30,"en":"**Sounds good**, let's have yakisoba at the festival.","ja":"いいね、祭りで焼きそばを食べよう。","chunks":[31]},{"id":31,"en":"We gave each other a **high five** after the round.","ja":"ラウンドの後、私たちはハイタッチをした。","chunks":[32]},{"id":32,"en":"Toyo-chan gave me a **thumbs up** when I hit a good shot.","ja":"いいショットを打った時、とよちゃんが親指を立ててくれた。","chunks":[33]},{"id":33,"en":"**Listen up**, the Deaf Athletics camp starts at one o'clock.","ja":"よく聞いて、デフ陸上の合宿は1時から始まる。","chunks":[34]},{"id":34,"en":"Toyo-chan and I like to **catch up** over tuna sandwiches.","ja":"とよちゃんと私はツナサンドを食べながら近況報告するのが好きだ。","chunks":[35]},{"id":35,"en":"\"**Bless you!**\" I said when Nutz sneezed.","ja":"ナッツがくしゃみをした時、「お大事に！」と言った。","chunks":[36]},{"id":36,"en":"**Help yourself** to the Jingisukan, there is plenty.","ja":"ジンギスカンをご自由にどうぞ、たくさんあるから。","chunks":[37]},{"id":37,"en":"**Just kidding**, I didn't really lose my golf clubs.","ja":"冗談だよ、ゴルフクラブを本当に無くしたわけじゃない。","chunks":[38]},{"id":38,"en":"We like to **hang out** at the golf practice range.","ja":"私たちはゴルフ練習場でぶらぶらするのが好きだ。","chunks":[39]},{"id":39,"en":"Let's **take five** before we walk Nutz again.","ja":"ナッツをまた散歩させる前にちょっと休憩しよう。","chunks":[40]},{"id":40,"en":"**Pretty please**, can we go to the beer garden tonight?","ja":"お願いだから、今夜ビアガーデンに行かない？","chunks":[41]},{"id":41,"en":"Sae and I made a **pinky promise** to cook together next time.","ja":"咲英と私は次は一緒に料理しようと指切りをした。","chunks":[42]},{"id":42,"en":"**Fingers crossed** the Marinos camp deal goes through.","ja":"マリノスのキャンプ誘致がうまくいきますように。","chunks":[43]},{"id":43,"en":"**In fact**, the beer at the festival was more expensive than at the yakiniku shop.","ja":"実際、祭りのビールは焼肉屋より高かった。","chunks":[44]},{"id":44,"en":"I hadn't seen Sae **in ages** before she came home.","ja":"咲英が帰省するまで、長い間会っていなかった。","chunks":[45]},{"id":45,"en":"**At last**, Sae arrived at Asahikawa Airport.","ja":"ついに咲英が旭川空港に到着した。","chunks":[46]},{"id":46,"en":"**So far**, my golf practice has gone well this week.","ja":"今のところ、今週のゴルフ練習は順調だ。","chunks":[47]},{"id":47,"en":"It was **so close**, I almost broke 100 in golf.","ja":"惜しかった、あと少しでゴルフのスコア100を切るところだった。","chunks":[48]},{"id":48,"en":"I'm **kind of** tired after the deaf athletics event.","ja":"デフ陸上のイベントの後、ちょっと疲れている。","chunks":[49]},{"id":49,"en":"The temperature at the golf course was **just right** today.","ja":"今日のゴルフ場の気温はちょうど良かった。","chunks":[50]},{"id":50,"en":"**Good luck** at the fencing tournament next week.","ja":"来週のフェンシング大会、頑張ってね。","chunks":[51]},{"id":51,"en":"**Safe travels**, Sae, on your trip to England.","ja":"安全な旅を、咲英、イギリスへの旅行で。","chunks":[52]},{"id":52,"en":"We are **nearly there**, the Marinos deal is almost done.","ja":"もうすぐだ、マリノスとの話がほぼまとまる。","chunks":[53]},{"id":53,"en":"**Come on**, Nutz, let's go for a walk!","ja":"おいで、ナッツ、散歩に行こう！","chunks":[54]},{"id":54,"en":"We are **all set** for the Keio baseball team's training camp.","ja":"慶応野球部の合宿の準備は万端だ。","chunks":[55]},{"id":55,"en":"**Either way**, Toyo-chan and I will enjoy the round.","ja":"どちらにしても、とよちゃんと私はラウンドを楽しむだろう。","chunks":[56]},{"id":56,"en":"**Except for** the parking lot incident, the golf day was great.","ja":"駐車場の出来事を除けば、ゴルフの日は最高だった。","chunks":[57]},{"id":57,"en":"**I guess so**, the mayor will probably attend the event.","ja":"そうかもね、市長はたぶんそのイベントに来るだろう。","chunks":[58]},{"id":58,"en":"**I'm not sure** if it will rain during the wrestling tournament.","ja":"レスリングの大会中に雨が降るかどうかわからない。","chunks":[59]},{"id":59,"en":"**I'd rather not** drink too much beer tonight.","ja":"今夜はあまりビールを飲まないでおこうと思う。","chunks":[60]},{"id":60,"en":"**I've had enough** beer for tonight, Toyo-chan.","ja":"とよちゃん、今夜はもうビールは十分飲んだよ。","chunks":[61]},{"id":61,"en":"**To be honest**, my golf score was not great today.","ja":"正直に言うと、今日のゴルフスコアは良くなかった。","chunks":[62]},{"id":62,"en":"**By the way**, did you hear the mayor is coming to the athletics event?","ja":"ところで、市長が陸上のイベントに来るって聞いた？","chunks":[63]},{"id":63,"en":"**By the looks** of the sky, it might rain soon.","ja":"空の様子から見ると、もうすぐ雨が降りそうだ。","chunks":[64]},{"id":64,"en":"**What on earth** happened at the stadium today?","ja":"一体今日競技場で何があったんだ？","chunks":[65]},{"id":65,"en":"**Do you mind** if I take a photo of Nutz?","ja":"ナッツの写真を撮ってもいいですか？","chunks":[66]},{"id":66,"en":"**Way to go**, Toyo-chan, on your first birdie!","ja":"よくやった、とよちゃん、初バーディーだね！","chunks":[67]},{"id":67,"en":"**That's not fair**, the manager only scolded the female staff.","ja":"それはずるい、管理者は女性スタッフにだけきつく当たった。","chunks":[68]},{"id":68,"en":"**Here you go**, here is your Jingisukan plate.","ja":"どうぞ、これがあなたのジンギスカンだよ。","chunks":[69]},{"id":69,"en":"We saw Keio baseball players **here and there** around the city.","ja":"街のあちこちで慶応野球部の選手たちを見かけた。","chunks":[70]},{"id":70,"en":"**I'm on it**, I'll send the hotel quote to Marinos today.","ja":"今すぐやります、今日中にマリノスへホテル見積もりを送ります。","chunks":[71]},{"id":71,"en":"I'm **on my way** to pick up Sae now.","ja":"今、咲英を迎えに向かっている途中だ。","chunks":[72]},{"id":72,"en":"**I'm about to** leave for the golf course.","ja":"これからゴルフ場に出発するところだ。","chunks":[73]},{"id":73,"en":"**It's time to** walk Nutz before it gets dark.","ja":"暗くなる前にナッツを散歩させる時間だ。","chunks":[74]},{"id":74,"en":"**Count me in** for the fencing event this weekend.","ja":"今週末のフェンシングのイベント、私も参加するよ。","chunks":[75]},{"id":75,"en":"I **look forward to** seeing Sae again soon.","ja":"また近いうちに咲英に会えるのを楽しみにしている。","chunks":[76]},{"id":76,"en":"We had a **laugh out loud** moment when Nutz got so excited.","ja":"ナッツがあまりに興奮した時、みんなで大笑いした。","chunks":[77]},{"id":77,"en":"**Take your time**, Toyo-chan, there's no rush to the golf course.","ja":"ゆっくりでいいよ、とよちゃん、ゴルフ場に急ぐ必要はないから。","chunks":[78]},{"id":78,"en":"**Just a sec**, let me finish this report for the mayor.","ja":"ちょっと待って、市長への報告書を仕上げるから。","chunks":[79]},{"id":79,"en":"**Cut it out**, Nutz, stop barking at the mailman!","ja":"やめて、ナッツ、郵便屋さんに吠えるのは！","chunks":[80]},{"id":80,"en":"**Hang in there**, the deaf athletics event will end soon.","ja":"頑張れ、デフ陸上のイベントはもうすぐ終わるから。","chunks":[81]},{"id":81,"en":"**Go for it**, Toyo-chan, aim for another birdie!","ja":"やってみなよ、とよちゃん、もう一度バーディーを狙って！","chunks":[82]},{"id":82,"en":"**Keep me posted** about the Marinos camp negotiation.","ja":"マリノスのキャンプ誘致の交渉について随時教えて。","chunks":[83]},{"id":83,"en":"**Let me know** when Sae's flight lands.","ja":"咲英の飛行機が着いたら教えてください。","chunks":[84]},{"id":84,"en":"I'm **happy to help** with the fencing event setup.","ja":"フェンシングのイベント準備を喜んで手伝います。","chunks":[85]},{"id":85,"en":"The early morning golf practice **is worth it**.","ja":"早朝のゴルフ練習はそれだけの価値がある。","chunks":[86]},{"id":86,"en":"The festival had an **all-you-can-drink** beer stand.","ja":"祭りには飲み放題のビアスタンドがあった。","chunks":[87]},{"id":87,"en":"We arrived **just in time** for the fencing match.","ja":"フェンシングの試合にちょうど間に合った。","chunks":[88]},{"id":88,"en":"I packed rain gear **just in case** it rains at the golf course.","ja":"念のためゴルフ場用に雨具を持っていった。","chunks":[89]},{"id":89,"en":"**No matter what** happens, I'll support Toyo-chan's golf game.","ja":"何があっても、とよちゃんのゴルフを応援するよ。","chunks":[90]},{"id":90,"en":"Sae and Toyo-chan played **rock, paper, scissors** to decide who cooks dinner.","ja":"咲英ととよちゃんは誰が夕食を作るか、じゃんけんで決めた。","chunks":[91]},{"id":91,"en":"**I knew it**, the manager would apologize eventually.","ja":"やっぱり、管理者は最終的に謝った。","chunks":[92]},{"id":92,"en":"**It's up to you**, Toyo-chan, whether we play golf or rest.","ja":"ゴルフをするか休むか、とよちゃん次第だよ。","chunks":[93]},{"id":93,"en":"**Long time no see**, Sae, welcome home!","ja":"お久しぶり、咲英、おかえり！","chunks":[94]},{"id":94,"en":"**Sorry to hear that** the stadium manager was so upset.","ja":"競技場の管理者があんなに怒っていたなんて残念だ。","chunks":[95]},{"id":95,"en":"I try to enjoy time with Toyo-chan **as much as possible**.","ja":"できるだけとよちゃんとの時間を楽しむようにしている。","chunks":[96]},{"id":96,"en":"We tried to **make the most of** the summer festival tickets.","ja":"夏祭りのチケットを最大限に活用しようとした。","chunks":[97]},{"id":97,"en":"**Every now and then**, Nutz sleeps on my lap during dinner.","ja":"時々、ナッツは夕食中に私の膝で寝る。","chunks":[98]},{"id":98,"en":"**The day after tomorrow**, the mayor will visit the stadium.","ja":"明後日、市長が競技場を訪れる予定だ。","chunks":[99]},{"id":99,"en":"**The day before yesterday**, Sae made ginger pork rolls for dinner.","ja":"一昨日、咲英が大葉巻き生姜焼きを作ってくれた。","chunks":[100]},{"id":100,"en":"**Oh well**, we can play golf again next weekend.","ja":"まあいいや、来週末にまたゴルフをすればいい。","chunks":[101]},{"id":101,"en":"**No wonder** Nutz is so tired, he ran around the park all day.","ja":"どうりでナッツが疲れているわけだ、一日中公園を走り回っていたから。","chunks":[102]},{"id":102,"en":"**No sweat**, I can finish the mayor's report tonight.","ja":"心配ない、市長への報告書は今夜終わらせられる。","chunks":[103]},{"id":103,"en":"It's **my shout** tonight, so let's go to the yakiniku shop.","ja":"今夜は私のおごりだから、焼肉屋に行こう。","chunks":[104]},{"id":104,"en":"\"**You're on!**\" I said when Toyo-chan bet on the golf score.","ja":"とよちゃんがゴルフのスコアで賭けを持ちかけた時、「乗った！」と言った。","chunks":[105]},{"id":105,"en":"**After you**, Sae, go through the door first.","ja":"お先にどうぞ、咲英、先にドアを通って。","chunks":[106]},{"id":106,"en":"**Say cheese!** I took a photo of Nutz and Sae together.","ja":"はい、チーズ！ナッツと咲英の写真を撮った。","chunks":[107]},{"id":107,"en":"**Well put**, Toyo-chan, that was a great way to explain the golf rule.","ja":"うまいこと言うね、とよちゃん、ゴルフのルールの説明の仕方が上手だった。","chunks":[108]},{"id":108,"en":"**Good call** bringing rain gear to the athletics event.","ja":"陸上のイベントに雨具を持って行ったのは良い判断だった。","chunks":[109]},{"id":109,"en":"**Time flies**, Sae is already back in England again.","ja":"時間が経つのは早い、咲英はもうイギリスに戻ってしまった。","chunks":[110]},{"id":110,"en":"I'm an **early bird**, so I get up at six thirty for golf.","ja":"私は早起きなので、ゴルフのために6時半に起きる。","chunks":[111]},{"id":111,"en":"Toyo-chan is a bit of a **night owl** on weekends.","ja":"とよちゃんは週末は少し夜型だ。","chunks":[112]},{"id":112,"en":"Nutz is such a **dad's boy**, he always follows me around.","ja":"ナッツは完全にパパっ子で、いつも私についてくる。","chunks":[113]},{"id":113,"en":"I felt like a **third wheel** when Toyo-chan's friends talked about work.","ja":"とよちゃんの友達が仕事の話をしていた時、私は余計者のように感じた。","chunks":[114]},{"id":114,"en":"Nutz is a **scaredy cat** around fireworks at the festival.","ja":"ナッツは祭りの花火が怖くて弱虫になる。","chunks":[115]},{"id":115,"en":"Sometimes I feel like a **lone wolf** at the office.","ja":"職場では時々一匹狼のように感じる。","chunks":[116]},{"id":116,"en":"Sae is a **fussy eater**, but she loved the Jingisukan.","ja":"咲英は好き嫌いが多いが、ジンギスカンは気に入った。","chunks":[117]},{"id":117,"en":"I let myself **sleep in** after the busy athletics weekend.","ja":"忙しかった陸上のイベントの週末の後、寝坊させてもらった。","chunks":[118]},{"id":118,"en":"**Sleep tight**, Sae, see you at the airport tomorrow.","ja":"よく寝てね、咲英、明日空港で会おう。","chunks":[119]},{"id":119,"en":"Let's **chill out** at home tonight instead of going out.","ja":"今夜は出かけないで家でゆったり過ごそう。","chunks":[120]},{"id":120,"en":"I**'m hooked on golf practice** these days.","ja":"最近ゴルフの練習にはまっている。","chunks":[121]},{"id":121,"en":"**Take it easy**, Toyo-chan, you don't need to rush the round.","ja":"気楽にやりなよ、とよちゃん、ラウンドを急ぐ必要はないから。","chunks":[122]},{"id":122,"en":"Sae **takes after** Toyo-chan when it comes to cooking.","ja":"咲英は料理に関してはとよちゃんに似ている。","chunks":[123]},{"id":123,"en":"I had to **think twice** before speaking to the stadium manager again.","ja":"競技場の管理者にまた話しかける前によく考えた。","chunks":[124]},{"id":124,"en":"Please **pay attention** when the mayor arrives at the venue.","ja":"市長が会場に到着したら注意を払ってください。","chunks":[125]},{"id":125,"en":"**Don't bother** bringing an umbrella, the weather looks clear.","ja":"気にしなくていいよ、傘は持ってこなくても天気は良さそうだから。","chunks":[126]},{"id":126,"en":"Hoping for a low golf score was just **wishful thinking** today.","ja":"今日低いゴルフスコアを期待するのはただの希望的観測だった。","chunks":[127]},{"id":127,"en":"**Tough luck** about the rain during the golf round.","ja":"ゴルフのラウンド中に雨が降ったのは運が悪かった。","chunks":[128]},{"id":128,"en":"I want to remember this trip with Sae **for good**.","ja":"咲英とのこの旅の思い出を永遠に覚えていたい。","chunks":[129]},{"id":129,"en":"Finding the golf course parking spot was **easy-peasy**.","ja":"ゴルフ場の駐車スペースを見つけるのはとても簡単だった。","chunks":[130]},{"id":130,"en":"I know the golf course **inside out** by now.","ja":"もう今ではそのゴルフ場を隅から隅まで知っている。","chunks":[131]},{"id":131,"en":"If the Marinos deal falls through, we need a **plan B**.","ja":"マリノスの話がだめになったら、代替案が必要だ。","chunks":[132]},{"id":132,"en":"**Are you sure** Sae's flight arrives at three?","ja":"咲英の飛行機が3時に着くって本当？","chunks":[133]},{"id":133,"en":"**I miss you**, Sae, please come home again soon.","ja":"会いたいよ、咲英、また早く帰ってきてね。","chunks":[134]},{"id":134,"en":"**I mean it**, Toyo-chan, that was your best round ever.","ja":"本気で言っているよ、とよちゃん、あれは君の最高のラウンドだった。","chunks":[135]},{"id":135,"en":"**Well, well, well**, the mayor showed up early today.","ja":"おやおや、今日は市長が早く来たね。","chunks":[136]},{"id":136,"en":"**Peek-a-boo!** Nutz loves this game with Sae.","ja":"いないいないばあ！ナッツは咲英とのこの遊びが大好きだ。","chunks":[137]},{"id":137,"en":"**Oh my god**, Toyo-chan really got a birdie!","ja":"えっ！とよちゃんが本当にバーディーを取った！","chunks":[138]},{"id":138,"en":"**That's too bad** the deaf athletics event had a scheduling problem, but we still paid our respects when we heard about a coach who had passed away, saying **rest in peace.**","ja":"デフ陸上のイベントで手続き問題があったのは残念だが、亡くなったコーチのことを聞いた時は安らかに眠ってほしいと思った。","chunks":[139,140]},{"id":139,"en":"**Good for you**, Toyo-chan, on your first birdie!","ja":"よかったね、とよちゃん、初バーディーだね！","chunks":[141]},{"id":140,"en":"I **might as well** finish the mayor's report tonight.","ja":"市長への報告書は今夜終わらせたほうがいい。","chunks":[142]},{"id":141,"en":"**What a shame** the rain ruined our golf plans!","ja":"雨でゴルフの予定が台無しになって残念だ！","chunks":[143]},{"id":142,"en":"**By all means**, join us at the summer festival, Sae.","ja":"もちろん、咲英も夏祭りに参加しよう。","chunks":[144]},{"id":143,"en":"It's **no big deal** if the golf score isn't great today.","ja":"今日のゴルフスコアが良くなくても大したことない。","chunks":[145]},{"id":144,"en":"Toyo-chan's cooking is **no match for** a professional chef, but I love it.","ja":"とよちゃんの料理はプロにはかなわないけど大好きだ。","chunks":[146]},{"id":145,"en":"Bringing an old golf bag to a fancy course felt like a **no-go**.","ja":"古いゴルフバッグを高級コースに持って行くのはダメな気がした。","chunks":[147]},{"id":146,"en":"Toyo-chan was **on a roll** during the whole golf round.","ja":"とよちゃんはラウンド中ずっと好調だった。","chunks":[148]},{"id":147,"en":"The crowd at the festival got a little **out of control**, and Toyo-chan was **under the weather** the next day from the heat.","ja":"祭りの人混みは少し手に負えなくなり、翌日とよちゃんは暑さで体調が悪かった。","chunks":[149,150]},{"id":148,"en":"Toyo-chan and Sae's friendship is a **win-win** for our family.","ja":"とよちゃんと咲英の仲の良さは家族にとって良いことだ。","chunks":[151]},{"id":149,"en":"The Marinos camp deal is not a **done deal** yet.","ja":"マリノスのキャンプ誘致はまだ確定事項ではない。","chunks":[152]},{"id":150,"en":"I pulled an **all-nighter** finishing the mayor's report.","ja":"市長への報告書を仕上げるために徹夜した。","chunks":[153]},{"id":151,"en":"Whether the Marinos deal happens is still a **toss-up**.","ja":"マリノスの話が実現するかはまだ五分五分だ。","chunks":[154]},{"id":152,"en":"That festival beer felt like a **rip-off** at 700 yen.","ja":"700円の祭りのビールはぼったくりに感じた。","chunks":[155]},{"id":153,"en":"I took a **day off** to pick up Sae at the airport.","ja":"咲英を空港に迎えに行くために休みを取った。","chunks":[156]},{"id":154,"en":"Fixing the golf swing is **a piece of cake** for Toyo-chan now.","ja":"今やゴルフのスイングを直すのはとよちゃんにとって簡単なことだ。","chunks":[157]},{"id":155,"en":"Arguing with the manager felt like a **waste of time**.","ja":"管理者と言い争うのは時間の無駄に感じた。","chunks":[158]},{"id":156,"en":"I don't have a **nine-to-five**, since sports events happen on weekends too.","ja":"スポーツイベントは週末にもあるので、私は完全な9時5時勤務ではない。","chunks":[159]},{"id":157,"en":"The manager's remark was a **wake-up call** about how I speak.","ja":"管理者の言葉は自分の話し方についての警鐘だった。","chunks":[160]},{"id":158,"en":"I don't want to be a **know-it-all** when talking about golf.","ja":"ゴルフについて話す時、知ったかぶりはしたくない。","chunks":[161]},{"id":159,"en":"I finished the report **in a heartbeat** once I focused.","ja":"集中したら、報告書はすぐに終わった。","chunks":[162]},{"id":160,"en":"We prepared the athletics event **in record time**.","ja":"陸上のイベントを記録的な速さで準備した。","chunks":[163]},{"id":161,"en":"Let's walk Nutz and greet the neighbors **one at a time**.","ja":"一人ずつ順番にナッツを散歩させながら近所の人に挨拶しよう。","chunks":[164]},{"id":162,"en":"I **was sick and tired** of the heat during the athletics class.","ja":"陸上教室の暑さにはもう疲れ果てていた。","chunks":[165]},{"id":163,"en":"We discussed the **pros and cons** of the Marinos hotel plan.","ja":"マリノスのホテルプランの賛否両論について話し合った。","chunks":[166]},{"id":164,"en":"Toyo-chan **was born and raised** in Asahikawa.","ja":"とよちゃんは旭川生まれ旭川育ちだ。","chunks":[167]},{"id":165,"en":"We delivered the festival flyers **door to door**.","ja":"祭りのチラシを一軒一軒配った。","chunks":[168]},{"id":166,"en":"The festival food stand said \"**bring your own**\" cup for drinks.","ja":"祭りの屋台は飲み物用のカップを各自持参にしていた。","chunks":[169]},{"id":167,"en":"I **ended up drinking** more beer than I planned at the festival.","ja":"祭りで予定より多くビールを飲む羽目になった。","chunks":[170]},{"id":168,"en":"Sae's joke helped **break the ice** at dinner.","ja":"咲英の冗談が夕食の場の緊張をほぐしてくれた。","chunks":[171]},{"id":169,"en":"We stopped to **grab a bite** before the golf round.","ja":"ラウンドの前に軽く食べるために立ち寄った。","chunks":[172]},{"id":170,"en":"My colleagues **lend a hand** with the athletics event every year.","ja":"同僚たちは毎年陸上のイベントを手伝ってくれる。","chunks":[173]},{"id":171,"en":"The Marinos negotiation **is finally on track**.","ja":"マリノスとの交渉はようやく順調に進んでいる。","chunks":[174]},{"id":172,"en":"I need to **sleep on it** before deciding on new golf clubs.","ja":"新しいゴルフクラブを買うかは一晩考えたい。","chunks":[175]},{"id":173,"en":"I think the manager **went too far** with his comments.","ja":"あの管理者の発言はやりすぎだったと思う。","chunks":[176]},{"id":174,"en":"I can always **count on Toyo-chan to cheer** me up.","ja":"いつもとよちゃんに元気づけてもらえると頼りにしている。","chunks":[177]},{"id":175,"en":"The heat during the athletics event **drove me crazy**.","ja":"陸上のイベント中の暑さには本当にイライラした。","chunks":[178]},{"id":176,"en":"Let's **live a little** and try that expensive golf course.","ja":"もっと人生楽しんで、あの高いゴルフコースに挑戦してみよう。","chunks":[179]},{"id":177,"en":"**Practice makes perfect**, so I keep going to the driving range.","ja":"継続は力なりだから、練習場に通い続けている。","chunks":[180]},{"id":178,"en":"**Whether or not** it rains, we'll still hold the athletics class.","ja":"雨が降るかどうかにかかわらず、陸上教室は開催する。","chunks":[181]},{"id":179,"en":"**If I were you**, I'd stay calm with the stadium manager.","ja":"もし私があなただったら、競技場の管理者には冷静でいるだろう。","chunks":[182]},{"id":180,"en":"**You know what I mean**, right, about the mayor's busy schedule?","ja":"市長の忙しいスケジュールについて、わかるでしょ？","chunks":[183]},{"id":181,"en":"Let's **give it a go** and try the new golf course this weekend.","ja":"今週末、新しいゴルフコースに挑戦してみよう。","chunks":[184]},{"id":182,"en":"**Give me a break**, the golf shop was way too expensive.","ja":"勘弁してくれよ、あのゴルフショップは高すぎた。","chunks":[185]},{"id":183,"en":"\"**Tell me about it**,\" Toyo-chan said about the summer heat.","ja":"「本当にそうだよね」ととよちゃんは夏の暑さについて言った。","chunks":[186]},{"id":184,"en":"\"**Get out of here**,\" I said when Toyo-chan told me about the birdie.","ja":"とよちゃんがバーディーの話をした時、「嘘でしょ」と言った。","chunks":[187]},{"id":185,"en":"I try to **go with the flow** when work gets unpredictable.","ja":"仕事が予測不能になった時は流れに従うようにしている。","chunks":[188]},{"id":186,"en":"We decided to **play it by ear** for the Marinos schedule.","ja":"マリノスのスケジュールは臨機応変にやることにした。","chunks":[189]},{"id":187,"en":"It took me a while to **wrap my head around** the new tax rule.","ja":"新しい税制のルールを理解するのに少し時間がかかった。","chunks":[190]},{"id":188,"en":"I**'m up for another round of golf** this weekend.","ja":"今週末もう一回ゴルフをする気がある。","chunks":[191]},{"id":189,"en":"**It's a small world**, I ran into an old classmate at the festival.","ja":"世間は狭いね、祭りで昔の同級生に会った。","chunks":[192]},{"id":190,"en":"Talking calmly to the stadium manager was **easier said than done**.","ja":"競技場の管理者に冷静に話すのは言うのは簡単だが実際は難しかった。","chunks":[193]},{"id":191,"en":"**For the most part**, the athletics class went really well.","ja":"大部分において、陸上教室はとてもうまくいった。","chunks":[194]},{"id":192,"en":"**On the other hand**, the manager's reaction caused some trouble.","ja":"その一方で、管理者の反応で少しトラブルになった。","chunks":[195]},{"id":193,"en":"I **gave it my best shot** during today's golf round.","ja":"今日のゴルフラウンドでは最善を尽くした。","chunks":[196]},{"id":194,"en":"**To cut a long story short**, Marinos might choose Asahikawa.","ja":"要するに、マリノスは旭川を選ぶかもしれない。","chunks":[197]},{"id":195,"en":"Golf with Toyo-chan gives me **the best of both worlds**: exercise and fun.","ja":"とよちゃんとのゴルフは運動と楽しさ、両方の良いところを兼ね備えている。","chunks":[198]},{"id":196,"en":"**At the end of the day**, I was proud of the athletics event.","ja":"結局は、陸上のイベントを誇りに思った。","chunks":[199]},{"id":197,"en":"I thanked Sae **from the bottom of my heart** for cooking dinner.","ja":"夕食を作ってくれた咲英に心から感謝した。","chunks":[200]},{"id":198,"en":"**Sweet dreams**, Nutz, see you in the morning.","ja":"いい夢見てね、ナッツ、また朝にね。","chunks":[201]},{"id":199,"en":"**Sure enough**, it rained right when we started the golf round.","ja":"案の定、ラウンドを始めた途端に雨が降った。","chunks":[202]},{"id":200,"en":"**Suit yourself**, Toyo-chan, if you want another beer.","ja":"好きにすればいいよ、とよちゃん、もう一杯ビールが欲しいなら。","chunks":[203]},{"id":201,"en":"**No offense**, Toyo-chan, but your golf swing needs work.","ja":"悪気はないけど、とよちゃん、スイングはもう少し直したほうがいいよ。","chunks":[204]},{"id":202,"en":"**Fancy that!** The manager apologized the next day.","ja":"驚いた！管理者が翌日謝ってきた。","chunks":[205]},{"id":203,"en":"Nutz likes to **mess around** in the garden all afternoon.","ja":"ナッツは午後中ずっと庭でふざけている。","chunks":[206]},{"id":204,"en":"**Sit tight**, Sae, the plane will land soon.","ja":"もうちょっと待ってて、咲英、もうすぐ飛行機が着くから。","chunks":[207]},{"id":205,"en":"Nutz tends to **nod off** right after his walk.","ja":"ナッツは散歩の後すぐに居眠りしてしまう。","chunks":[208]},{"id":206,"en":"I want to **touch base** with the Marinos staff again next week.","ja":"来週もう一度マリノスのスタッフと連絡を取りたい。","chunks":[209]},{"id":207,"en":"Toyo-chan really **nailed it** with her golf swing today.","ja":"今日とよちゃんは本当にゴルフのスイングを完璧にこなした。","chunks":[210]},{"id":208,"en":"I don't want to **cut corners** when preparing the mayor's report.","ja":"市長への報告書を作る時は手を抜きたくない。","chunks":[211]},{"id":209,"en":"I started to **freak out** when Nutz ran toward the road.","ja":"ナッツが道路の方へ走った時、パニックになりかけた。","chunks":[212]},{"id":210,"en":"The **case was closed** after the manager apologized.","ja":"管理者が謝罪した後、その件は一件落着した。","chunks":[213]},{"id":211,"en":"Let's take a **rain check** on golf this weekend because of the weather.","ja":"天気が悪いから今週末のゴルフは延期にしよう。","chunks":[214]},{"id":212,"en":"Toyo-chan has a real **sweet tooth** for festival treats.","ja":"とよちゃんは祭りのお菓子に目がない甘党だ。","chunks":[215]},{"id":213,"en":"We asked for a **doggy bag** after the Jingisukan dinner.","ja":"ジンギスカンの夕食後、持ち帰り用の袋をお願いした。","chunks":[216]},{"id":214,"en":"Visiting Sae in England is on my **bucket list**.","ja":"イギリスの咲英を訪ねることは死ぬ前にやりたいことリストに入っている。","chunks":[217]},{"id":215,"en":"Our whole family is a **dog person** because of Nutz.","ja":"ナッツのおかげで我が家はみんな犬派だ。","chunks":[218]},{"id":216,"en":"The stadium manager seemed a bit **two-faced** during the meeting.","ja":"その競技場の管理者は会議中、少し裏表があるように見えた。","chunks":[219]},{"id":217,"en":"It was **crystal clear** that Toyo-chan was happy after her birdie.","ja":"バーディーの後、とよちゃんが喜んでいるのは非常に明瞭だった。","chunks":[220]},{"id":218,"en":"It was just **not my day** at the golf course today.","ja":"今日はゴルフ場でツイてない日だった。","chunks":[221]},{"id":219,"en":"**For God's sake**, please stop shouting at the staff.","ja":"お願いだから、スタッフに怒鳴るのはやめてほしい。","chunks":[222]},{"id":220,"en":"**Bear with me** while I finish this report for the mayor.","ja":"ちょっと待ってて、市長への報告書を仕上げるから。","chunks":[223]},{"id":221,"en":"**So they say**, the new golf course is very challenging.","ja":"そう言われている、その新しいゴルフコースはとても難しいらしい。","chunks":[224]},{"id":222,"en":"**How dare you** speak to my staff like that!","ja":"よくもまあ私のスタッフにそんな言い方ができるな！","chunks":[225]},{"id":223,"en":"We had a nice **get-together** with Toyo-chan's friends, and someone even joked with a silly **pick-up line**.","ja":"とよちゃんの友達と楽しい懇親会を開いて、誰かが冗談でナンパの口説き文句を言っていた。","chunks":[226,230]},{"id":224,"en":"The Marinos deal could be a real **game-changer** for the city.","ja":"マリノスの誘致は市にとって画期的なことになるかもしれない。","chunks":[227]},{"id":225,"en":"Toyo-chan is my **one and only** golf partner.","ja":"とよちゃんは私のただ一人のゴルフパートナーだ。","chunks":[228]},{"id":226,"en":"The manager's remark was **the last straw** for the staff.","ja":"あの管理者の発言がスタッフの堪忍袋の緒を切らせた。","chunks":[229]},{"id":227,"en":"I felt like the **odd one out** among the young golfers.","ja":"若いゴルファーたちの中で私は仲間外れのような気がした。","chunks":[231]},{"id":228,"en":"Nutz is the **pride and joy** of our family.","ja":"ナッツは我が家の自慢の宝物だ。","chunks":[232]},{"id":229,"en":"Photography seems right **up my alley** these days.","ja":"最近、写真は私にぴったりの趣味のようだ。","chunks":[233]},{"id":230,"en":"The extra Jingisukan was **on the house** that day.","ja":"その日、追加のジンギスカンはお店のおごりだった。","chunks":[234]},{"id":231,"en":"I've been **on the go** all week with sports events."," arly for the golf course tomorrow.","ja":"明日はゴルフ場に向けて早めに出発しよう。","chunks":[252]},{"id":249,"en":"Sae **blew a kiss** to Nutz before leaving for the airport.","ja":"空港に向かう前、咲英はナッツに投げキッスをした。","chunks":[253]},{"id":250,"en":"My guess about the golf score **was way off**.","ja":"ゴルフスコアの予想は大外れだった。","chunks":[254]},{"id":251,"en":"I think the manager's comment **missed the point** entirely.","ja":"あの管理者の発言は完全に的外れだったと思う。","chunks":[255]},{"id":252,"en":"**Break a leg** at the fencing competition, Sae.","ja":"頑張ってね、咲英、フェンシングの大会で。","chunks":[256]},{"id":253,"en":"We talked things over to **clear the air** with the manager.","ja":"管理者との誤解を解くために話し合った。","chunks":[257]},{"id":254,"en":"Toyo-chan **dropped a hint** that she wanted new golf shoes.","ja":"とよちゃんは新しいゴルフシューズが欲しいとほのめかした。","chunks":[258]},{"id":255,"en":"I really **dropped the ball** forgetting the athletics schedule.","ja":"陸上のスケジュールを忘れてしまい、大失敗した。","chunks":[259]},{"id":256,"en":"I **ran into an old friend** at the golf shop today.","ja":"今日ゴルフショップで昔の友人に偶然会った。","chunks":[260]},{"id":257,"en":"We **were out of luck** when it rained during the golf round.","ja":"ラウンド中に雨が降って運が悪かった。","chunks":[261]},{"id":258,"en":"Nutz **lost his way** in the tall grass at the park.","ja":"ナッツは公園の背の高い草の中で迷子になった。","chunks":[262]},{"id":259,"en":"I need to **up my game** before the next golf round.","ja":"次のラウンドまでに腕を上げる必要がある。","chunks":[263]},{"id":260,"en":"Sae's surprise visit really **made my day**.","ja":"咲英のサプライズ訪問は本当に私を喜ばせた。","chunks":[264]},{"id":261,"en":"**Rise and shine**, we have an early golf tee time.","ja":"起きなさい、早いゴルフのスタート時間があるよ。","chunks":[265]},{"id":262,"en":"Toyo-chan tried to **play it cool** about her birdie.","ja":"とよちゃんはバーディーについて冷静を装おうとした。","chunks":[266]},{"id":263,"en":"Let's **wait and see** how the Marinos negotiation goes.","ja":"マリノスとの交渉がどうなるか様子を見よう。","chunks":[267]},{"id":264,"en":"I told Toyo-chan to **get a grip** after the stressful day.","ja":"ストレスの多い日の後、とよちゃんに落ち着くように言った。","chunks":[268]},{"id":265,"en":"We ]},{"id":314,"en":"The stadium manager turned out to be a **tough cookie**.","ja":"あの競技場の管理者は結局手強い人だった。","chunks":[318]},{"id":315,"en":"I got a **second wind** after a short break at the festival.","ja":"祭りで少し休憩したら元気を取り戻した。","chunks":[319]},{"id":316,"en":"Sae was the **life of the party** at the family dinner.","ja":"咲英は家族の夕食会で場を盛り上げる存在だった。","chunks":[320]},{"id":317,"en":"**My in-laws** also enjoy golf as much as I do.","ja":"私の義理の家族も私と同じくらいゴルフが好きだ。","chunks":[321]},{"id":318,"en":"Toyo-chan **is truly my better half**.","ja":"とよちゃんは本当に私のパートナーだ。","chunks":[322]},{"id":319,"en":"My golf improvement felt like a **one-hit wonder**, just one good round.","ja":"私のゴルフの上達は一発屋のように、良かったのはあの一回だけだった。","chunks":[323]},{"id":320,"en":"Sae went through her **terrible twos** a long time ago now.","ja":"咲英のイヤイヤ期はもうずっと前のことだ。","chunks":[324]},{"id":321,"en":"At city hall, I have to be a **jack-of-all-trades**.","ja":"市役所では何でも屋にならないといけない。","chunks":[325]},{"id":322,"en":"Sae is a **chip off the old block** when it comes to cooking.","ja":"料理に関して咲英は親にそっくりだ。","chunks":[326]},{"id":323,"en":"The athletics event welcomed **people from all walks of life**.","ja":"陸上のイベントには様々な立場の人々が集まった。","chunks":[327]},{"id":324,"en":"Toyo-chan and Sae are like **two peas in a pod**.","ja":"とよちゃんと咲英はとてもよく似ている。","chunks":[328]},{"id":325,"en":"I've **been out of shape** since I stopped jogging this summer.","ja":"今年の夏ジョギングをやめてから運動不足だ。","chunks":[329]},{"id":326,"en":"The festival food was a **mixed bag** this year.","ja":"今年の祭りの屋台は当たり外れが大きかった。","chunks":[330]},{"id":327,"en":"The **silver lining** of the rain was a quiet round of golf.","ja":"雨の中の唯一の良い点は静かなラウンドだったことだ。","chunks":[331]},{"id":328,"en":"I told a **white lie** about how good my golf score was.","ja":"自分のゴルフスコアについてちょっとした嘘をついた。","chunks":[332]},{"id":329,"en":"The manager's tone was a **red flag** before the argument.","ja":"あの管理者の口調は言い争いの前の危険信号だった。","chunks":[333]},{"id":330,"en":"Sae's return felt like a **new chapter** for our family.","ja":"咲英の帰省は我が家にとって新たな1章のようだった。","chunks":[334]},{"id":331,"en":"Drinking too much can be a **slippery slope** on weekends.","ja":"週末に飲みすぎるのは危険な連鎖に陥りやすい。","chunks":[335]},{"id":332,"en":"The **best bit** of the festival was the fireworks with Sae.","ja":"祭りで一番良かったのは咲英と見た花火だった。","chunks":[336]},{"id":333,"en":"**The bottom line** is, the Marinos deal needs a good hotel quote.","ja":"結論としては、マリノスの話には良いホテル見積もりが必要だ。","chunks":[337]},{"id":334,"en":"Coffee with MCT oil is my morning **pick-me-up**.","ja":"MCTオイル入りコーヒーは私の朝の元気づけだ。","chunks":[338]},{"id":335,"en":"Watching Keio baseball practice **is really my cup of tea**.","ja":"慶応野球部の練習を見るのは本当に私の好みだ。","chunks":[339]},{"id":336,"en":"The manager's remark felt like a **slap in the face**.","ja":"あの管理者の発言はひどい仕打ちのように感じた。","chunks":[340]},{"id":337,"en":"Sae's visit was a **breath of fresh air** after a hard week.","ja":"大変な一週間の後、咲英の訪問は新鮮な気分をくれた。","chunks":[341]},{"id":338,"en":"The argument with the manager is now **water under the bridge**.","ja":"管理者との言い争いはもう過去のことだ。","chunks":[342]},{"id":339,"en":"Signing Marinos would be a **whole new ball game** for the city.","ja":"マリノスとの契約は市にとってまったく新しい状況になるだろう。","chunks":[343]},{"id":340,"en":"The festival beer garden felt like a **free-for-all** at times.","ja":"祭りのビアガーデンは時々やりたい放題な雰囲気だった。","chunks":[344]},{"id":341,"en":"I told the manager he was **splitting hairs** over the paperwork.","ja":"書類のことで細かすぎると管理者に言った。","chunks":[345]},{"id":342,"en":"Toyo-chan keeps our house **spick and span**.","ja":"とよちゃんは家をいつもピカピカにしている。","chunks":[346]},{"id":343,"en":"Getting the stadium manager to agree was **like pulling teeth**.","ja":"競技場の管理者を説得するのはものすごく大変だった。","chunks":[347]},{"id":344,"en":"Waiting for the rain to stop was **like watching paint dry**.","ja":"雨がやむのを待つのは非常に退屈だった。","chunks":[348]},{"id":345,"en":"My old golf bag **is on its last legs** now.","ja":"私の古いゴルフバッグはもう壊れかけている。","chunks":[349]},{"id":346,"en":"I left the golf schedule **as it is** for next week.","ja":"来週のゴルフの予定はそのままにしておいた。"," 363,"en":"The rain started **in the blink of an eye** during our round.","ja":"ラウンド中、一瞬で雨が降り始めた。","chunks":[367]},{"id":364,"en":"\"**Bottoms up!**\" we said before the Jingisukan party.","ja":"ジンギスカンパーティーの前に「一気飲み！」と言った。","chunks":[368]},{"id":365,"en":"That cold beer really **hit the spot** after golf.","ja":"ゴルフの後の冷たいビールは本当に満足だった。","chunks":[369]},{"id":366,"en":"We did a small **pub crawl** near the summer festival.","ja":"夏祭りの近くで軽くはしご酒をした。","chunks":[370]},{"id":367,"en":"Sae wanted a **night on the town** before flying back.","ja":"咲英は飛行機で戻る前に街へ繰り出したがった。","chunks":[371]},{"id":368,"en":"The Jingisukan meat seemed to **melt in one's mouth**.","ja":"そのジンギスカンの肉は口の中でとろけるようだった。","chunks":[372]},{"id":369,"en":"Toyo-chan joked about needing **hair of the dog** the next morning.","ja":"とよちゃんは翌朝迎え酒が必要だと冗談を言った。","chunks":[373]},{"id":370,"en":"We found a great **hole in the wall** ramen shop downtown.","ja":"街中で目立たない良いラーメン屋を見つけた。","chunks":[374]},{"id":371,"en":"**My eyes were bigger than my stomach** at the Jingisukan dinner.","ja":"ジンギスカンの夕食で目の前の量より多く取りすぎてしまった。","chunks":[375]},{"id":372,"en":"I accidentally **spilled the beans** about Sae's surprise visit.","ja":"うっかり咲英のサプライズ訪問の秘密を漏らしてしまった。","chunks":[376]},{"id":373,"en":"\"**Take it away**,\" I told the mayor at the ceremony.","ja":"式典で「どうぞ始めてください」と市長に言った。","chunks":[377]},{"id":374,"en":"I told the staff to **tread lightly** with the upset manager.","ja":"怒っている管理者には慎重に対応するようスタッフに言った。","chunks":[378]},{"id":375,"en":"**Here's my two cents** on the Marinos hotel plan.","ja":"マリノスのホテルプランについて、これが私の意見だ。","chunks":[379]},{"id":376,"en":"I heard **through the grapevine** that Marinos likes our proposal.","ja":"マリノスが私たちの提案を気に入っているとうわさで聞いた。","chunks":[380]},{"id":377,"en":"I had to **read between the lines** of the manager's email.","ja":"管理者のメールの行間を読む必要があった。","chunks":[381]},{"id":378,"en":"This new golf term doesn't quite **roll off the tongue**.","ja":"この新しいゴルフ用語はまだ言いにくい。","chunks":[382]},{"id":379,"en":"I had to **pull unks":[541]},{"id":542,"en":"The mayor **came into the picture** right before the ceremony.","ja":"式典の直前に市長が関わるようになった。","chunks":[542]},{"id":543,"en":"I told the staff to **keep their eyes peeled** for the mayor's car.","ja":"スタッフに市長の車に注意深く気を配るよう伝えた。","chunks":[543]},{"id":544,"en":"Trying English conversation pushed me **outside my comfort zone**.","ja":"英会話に挑戦することは私を居心地の良い場所から飛び出させた。","chunks":[544]},{"id":545,"en":"I **have something up my sleeve** for the Marinos negotiation.","ja":"マリノスとの交渉に秘策を用意している。","chunks":[545]},{"id":546,"en":"I decided to **keep the surprise party under my hat**.","ja":"サプライズパーティーのことは秘密にしておくことにした。","chunks":[546]},{"id":547,"en":"Learning English helped me **turn over a new leaf** this year.","ja":"英語学習は今年、心機一転するきっかけになった。","chunks":[547]},{"id":548,"en":"I think Toyo-chan **went overboard** buying golf accessories.","ja":"とよちゃんはゴルフグッズを買いすぎだと思う。","chunks":[548]},{"id":549,"en":"Nutz seemed to **run amok** chasing squirrels in the park.","ja":"ナッツは公園でリスを追いかけて暴れ回った。","chunks":[549]},{"id":550,"en":"The summer heat can really **drive one nuts** during work.","ja":"夏の暑さは仕事中、本当にイライラさせる。","chunks":[550]},{"id":551,"en":"The deaf athletes seemed to **risk their life** for every race.","ja":"デフの選手たちは毎レース命懸けでやっているようだった。","chunks":[551]},{"id":552,"en":"I **held my breath** waiting for Toyo-chan's putt to go in.","ja":"とよちゃんのパットが入るのを息を止めて待った。","chunks":[552]},{"id":553,"en":"I had to **hold back tears** watching Sae leave for the airport.","ja":"咲英が空港へ向かうのを見て涙をこらえなければならなかった。","chunks":[553]},{"id":554,"en":"I **got cold feet** before speaking English at the meeting.","ja":"会議で英語を話す前に怖気づいてしまった。","chunks":[554]},{"id":555,"en":"The stadium manager tried not to **make a scene** in front of others.","ja":"その競技場の管理者は他人の前で大騒ぎしないようにした。","chunks":[555]},{"id":556,"en":"I **drew a blank** trying to remember the manager's name.","ja":"その管理者の名前を思い出そうとして思い出せなかった。","chunks":[556]},{"id":557,"en":"The meeting time completely **slipped my mind** yesterday.","ja":"昨日、会議の時間を完全に忘れてしまった。","chunks":[557]},{"id":558,"en":"I told the staff to **watch their back** around the strict manager.","ja":"厳しい管理者の周りでは気をつけるようスタッフに言った。","chunks":[558]},{"id":559,"en":"I don't want to **lead anyone on** about the Marinos deal timing.","ja":"マリノスの話のタイミングについて誰にも期待を持たせすぎたくない。","chunks":[559]},{"id":560,"en":"I felt bad **letting Toyo-chan down** about the cancelled golf date.","ja":"ゴルフのデートが中止になって、とよちゃんをがっかりさせて申し訳なく思った。","chunks":[560]},{"id":561,"en":"We had to **kick a rowdy guest out** of the beer garden.","ja":"ビアガーデンで騒がしい客を追い出さなければならなかった。","chunks":[561]},{"id":562,"en":"I never expected the manager to **flip me off** in anger.","ja":"あの管理者が怒って中指を立てるとは思わなかった。","chunks":[562]},{"id":563,"en":"My old golf shoes finally **bit the dust** this year.","ja":"古いゴルフシューズが今年ついにダメになった。","chunks":[563]},{"id":564,"en":"I try not to **take Toyo-chan's cooking for granted**.","ja":"とよちゃんの料理を当たり前だと思わないようにしている。","chunks":[564]},{"id":565,"en":"I felt like I was **walking on eggshells** around the manager.","ja":"あの管理者の周りでは細心の注意を払っているように感じた。","chunks":[565]},{"id":566,"en":"Toyo-chan almost **went to pieces** hearing about the rain forecast.","ja":"雨の予報を聞いて、とよちゃんは少し取り乱しそうになった。","chunks":[566]},{"id":567,"en":"I worried Sae might **go off the rails** living far away alone.","ja":"遠く離れて一人暮らしする咲英がグレないか心配だった。","chunks":[567]},{"id":568,"en":"My golf confidence **hit rock bottom** after that bad round.","ja":"あの悪いラウンドの後、ゴルフの自信はどん底に落ちた。","chunks":[568]},{"id":569,"en":"I **was down in the dumps** after the argument with the manager.","ja":"あの管理者との言い争いの後、落ち込んでいた。","chunks":[569]},{"id":570,"en":"Nutz didn't quite **throw a tantrum**, but he barked a lot.","ja":"ナッツはかんしゃくとまではいかないが、たくさん吠えた。","chunks":[570]},{"id":571,"en":"I regret that I **lost my temper** with the stadium manager.","ja":"あの競技場の管理者にキレてしまったことを後悔している。","chunks":[571]},{"id":572,"en":"I **ran out of steam** near the end of the athletics event.","ja":"陸上のイベントの終盤で気力がなくなった。","chunks":[572]},{"id":573,"en":"I felt like I was **running around in circles** preparing for Marinos.","ja":"マリノスの準備でただ無駄に忙しく動き回っているように感じた。","chunks":[573]},{"id":574,"en":"I **got carried away** buying new golf gear this month.","ja":"今月、新しいゴルフ用品を買いすぎて調子に乗ってしまった。","chunks":[574]},{"id":575,"en":"The manager's tone really **got under my skin** that day.","ja":"あの日、その管理者の口調は本当に私をイライラさせた。","chunks":[575]},{"id":576,"en":"The manager knew exactly how to **push my buttons**.","ja":"あの管理者は私を怒らせるツボを完全に理解していた。","chunks":[576]},{"id":577,"en":"His comment really **rubbed me the wrong way**.","ja":"彼の発言は本当に私の神経を逆なでした。","chunks":[577]},{"id":578,"en":"I try never to **talk behind a colleague's back**.","ja":"同僚の陰口を言うことは絶対にしないようにしている。","chunks":[578]},{"id":579,"en":"I chose to **look the other way** about the small mistake.","ja":"その小さなミスについては見て見ぬふりをすることにした。","chunks":[579]},{"id":580,"en":"I decided to **turn a blind eye** to the minor rule violation.","ja":"軽微な規則違反については見て見ぬふりをすることにした。","chunks":[580]},{"id":581,"en":"I hope I never **act high and mighty** as a section manager.","ja":"セクションマネージャーとして偉ぶることは絶対にしたくない。","chunks":[581]},{"id":582,"en":"The manager **gave my staff the cold shoulder** for weeks.","ja":"その管理者は何週間もスタッフを無視し続けた。","chunks":[582]},{"id":583,"en":"Nutz **caught the mailman off guard** by barking suddenly.","ja":"ナッツは突然吠えて郵便屋さんの意表をついた。","chunks":[583]},{"id":584,"en":"I nearly **flew off the handle** when the manager raised his voice.","ja":"その管理者が声を荒げた時、危うくキレそうになった。","chunks":[584]},{"id":585,"en":"I told the staff not to **make light of the manager's complaint.**","ja":"その管理者の苦情を軽んじないようスタッフに言った。","chunks":[585]},{"id":586,"en":"I refused to **throw in the towel** on the Marinos negotiation.","ja":"マリノスとの交渉であきらめることは拒否した。","chunks":[586]},{"id":587,"en":"I **lost my train of thought** while explaining the golf rules.","ja":"ゴルフのルールを説明している最中に何を言おうとしたか忘れてしまった。","chunks":[587]},{"id":588,"en":"The manager didn't need to **jump down my throat** like that.","ja":"その管理者があんなに激しく叱りつける必要はなかった。","chunks":[588]},{"id":589,"en":"I never expected a colleague to **stab me in the back**.","ja":"同僚に裏切られるとは思ってもみなかった。","chunks":[589]},{"id":590,"en":"I try not to **bury my head in the sand** about tough problems.","ja":"難しい問題について現実を無視しないようにしている。","chunks":[590]},{"id":591,"en":"I may have **bitten off more than I could chew** with three projects.","ja":"3つのプロジェクトを引き受けて自分の能力を超えたかもしれない。","chunks":[591]},{"id":592,"en":"Nutz felt like a **sitting duck** near the vacuum cleaner.","ja":"ナッツは掃除機の近くで無防備な標的のようだった。","chunks":[592]},{"id":593,"en":"Toyo-chan is a real **social butterfly** at every festival.","ja":"とよちゃんはどの祭りでも本当に社交的な人だ。","chunks":[593]},{"id":594,"en":"I sometimes felt like the **black sheep** among younger colleagues.","ja":"若い同僚たちの中で時々厄介者のように感じた。","chunks":[594]},{"id":595,"en":"That Jingisukan shop is the **bee's knees** in this town.","ja":"あのジンギスカン屋はこの街で最高の店だ。","chunks":[595]},{"id":596,"en":"I almost **chickened out** before speaking English at the meeting.","ja":"会議で英語を話す前に怖気づきそうになった。","chunks":[596]},{"id":597,"en":"Nutz gave me **puppy-dog eyes** for a piece of Jingisukan.","ja":"ナッツはジンギスカンを一切れ欲しくて子犬のような目をした。","chunks":[597]},{"id":598,"en":"**Hold your horses**, Nutz, dinner isn't ready yet.","ja":"ちょっと待って、ナッツ、夕食はまだできていないよ。","chunks":[598]},{"id":599,"en":"The golf course is close to home, **as the crow flies**.","ja":"そのゴルフ場は直線距離では家からとても近い。","chunks":[599]},{"id":600,"en":"Applications for the festival stalls seemed to **drop like flies** this year.","ja":"今年は祭りの屋台の申し込みがかなり減ったようだった。","chunks":[600]},{"id":601,"en":"The stadium schedule issue was the **elephant in the room** at the meeting.","ja":"会議では競技場のスケジュール問題が誰も触れたくない話題だった。","chunks":[601]},{"id":602,"en":"It started to **rain cats and dogs** during our golf round.","ja":"ゴルフのラウンド中、大雨が降り始めた。","chunks":[602]},{"id":603,"en":"Nutz always **has ants in his pants** before his evening walk.","ja":"ナッツは夕方の散歩前はいつも落ち着かない。","chunks":[603]},{"id":604,"en":"I **had butterflies in my stomach** before speaking English at the meeting.","ja":"会議で英語を話す前、胸がドキドキした。","chunks":[604]},{"id":605,"en":"I **have bigger fish to fry** than worrying about the golf score.","ja":"ゴルフのスコアを気にするより、もっと大切な用事がある。","chunks":[605]},{"id":606,"en":"\"**Cat got your tongue?**\" I asked when Sae went quiet.","ja":"咲英が黙り込んだ時、「なんで黙っているの？」と聞いた。","chunks":[606]},{"id":607,"en":"Nutz just does **monkey see, monkey do** with the other dogs.","ja":"ナッツは他の犬たちの真似をするだけだ。","chunks":[607]},{"id":608,"en":"Picking up Sae and shopping for golf gear killed **two birds with one stone**.","ja":"咲英を迎えに行きながらゴルフ用品も買って一石二鳥だった。","chunks":[608]},{"id":609,"en":"For Sae in England, **the world really is her oyster**.","ja":"イギリスにいる咲英にとって、世界は思いのままだ。","chunks":[609]},{"id":610,"en":"I felt **like a fish out of water** at the fancy golf club at first.","ja":"最初、あの高級ゴルフクラブでは場違いな気分だった。","chunks":[610]},{"id":611,"en":"Toyo-chan accidentally **let the cat out of the bag** about the surprise.","ja":"とよちゃんはうっかりサプライズの秘密をばらしてしまった。","chunks":[611]},{"id":612,"en":"**A leopard can't change its spots**, so the manager stayed strict.","ja":"人の性格は変わらないもので、その管理者は厳しいままだった。","chunks":[612]},{"id":613,"en":"The manager's rude comment was **the straw that broke the camel's back**.","ja":"その管理者の失礼な発言が我慢の限界を超えさせた。","chunks":[613]},{"id":614,"en":"**Best wishes** to Sae on her new life in England.","ja":"イギリスでの新生活を送る咲英に幸運を祈る。","chunks":[614]},{"id":615,"en":"I offered **my condolences** to a colleague who lost his father.","ja":"父親を亡くした同僚にお悔やみを申し上げた。","chunks":[615]},{"id":616,"en":"**Good riddance** to that old, worn-out golf bag.","ja":"あの古くてボロボロのゴルフバッグとはこれでお別れだ、清々した。","chunks":[616]},{"id":617,"en":"**I owe you** one for helping with the athletics event, thank you.","ja":"陸上のイベントを手伝ってくれて、あなたに借りができたよ、ありがとう。","chunks":[617]},{"id":618,"en":"**Be my guest** and try the Jingisukan, it's delicious.","ja":"どうぞ遠慮なくジンギスカンを食べてみて、美味しいよ。","chunks":[618]},{"id":619,"en":"**On second thought**, let's not play golf in this heat.","ja":"やっぱり、この暑さの中でゴルフはやめておこう。","chunks":[619]},{"id":620,"en":"**No hard feelings** about the golf bet, Toyo-chan.","ja":"ゴルフの賭けのこと、悪く思わないでね、とよちゃん。","chunks":[620]},{"id":621,"en":"\"**Join the club**,\" I said when a colleague also lost to the manager's rules.","ja":"同僚もその管理者のルールに苦しんでいると聞いて「私も」と言った。","chunks":[621]},{"id":622,"en":"Toyo-chan and Sae **mean the world** to me.","ja":"とよちゃんと咲英は私にとってかけがえのない存在だ。","chunks":[622]},{"id":623,"en":"Sae arrived home **safe and sound** from her trip.","ja":"咲英は旅から無事に帰ってきた。","chunks":[623]},{"id":624,"en":"Playing golf with Toyo-chan gives me real **peace of mind**.","ja":"とよちゃんとゴルフをすることは本当の心の平和をくれる。","chunks":[624]},{"id":625,"en":"Finishing the athletics event was **mind over matter** in that heat.","ja":"あの暑さの中で陸上のイベントを終えたのは気力の問題だった。","chunks":[625]},{"id":626,"en":"**Lo and behold**, the rain stopped just before our tee time.","ja":"驚いたことに、私たちのスタート時間の直前に雨が止んだ。","chunks":[626]},{"id":627,"en":"\"**Who am I kidding?**\" I thought about beating my golf record soon.","ja":"すぐにゴルフの記録を更新できるなんて「何言ってんだ」と思った。","chunks":[627]},{"id":628,"en":"\"**What's the catch?**\" I asked about the cheap golf club deal.","ja":"その安いゴルフクラブの取引について「何がねらい？」と聞いた。","chunks":[628]},{"id":629,"en":"**You never know**, the Marinos deal could still fall through.","ja":"まだわからないよ、マリノスの話がだめになる可能性もある。","chunks":[629]},{"id":630,"en":"**Make yourself at home**, Sae, welcome back.","ja":"どうぞくつろいで、咲英、おかえり。","chunks":[630]},{"id":631,"en":"Fine, **have it your way**, Toyo-chan, we'll skip golf today.","ja":"わかった、好きにすれば、とよちゃん、今日はゴルフをやめよう。","chunks":[631]},{"id":632,"en":"Fixing that small tax report bug, **there's nothing to it.**","ja":"あの小さな税務報告書のミスを直すのは簡単だよ。","chunks":[632]},{"id":633,"en":"We waited until **the coast was clear** to sneak Nutz a treat.","ja":"誰も見ていないのを確認してからナッツにおやつをこっそりあげた。","chunks":[633]},{"id":634,"en":"**On the flip side**, the rain made the golf course less crowded.","ja":"その一方で、雨のおかげでゴルフ場は空いていた。","chunks":[634]},{"id":635,"en":"I **was on the edge of my seat** watching the fencing match.","ja":"フェンシングの試合をハラハラしながら見た。","chunks":[635]},{"id":636,"en":"**For crying out loud**, please just answer the phone, Toyo-chan!","ja":"頼むから、とよちゃん、ちゃんと電話に出て！","chunks":[636]},{"id":637,"en":"Work at city hall this week has been **same old, same old**.","ja":"今週の市役所の仕事はいつも通りだった。","chunks":[637]},{"id":638,"en":"\"**Will you do the honors?**\" I asked Toyo-chan before cutting the cake.","ja":"ケーキを切る前に「お願いできる？」ととよちゃんに聞いた。","chunks":[638]},{"id":639,"en":"The **moral of the story** is to always bring rain gear to golf.","ja":"この話の教訓は、ゴルフには常に雨具を持って行くことだ。","chunks":[639]},{"id":640,"en":"**Age is just a number**, Toyo-chan says about starting golf late.","ja":"年齢は関係ないと、遅くゴルフを始めたことについてとよちゃんは言う。","chunks":[640]},{"id":641,"en":"It felt like **it's all downhill from here** after finishing the report.","ja":"報告書を仕上げた後は、これ以降ずっと楽な気がした。","chunks":[641]},{"id":642,"en":"**The ball is in Marinos's court** now for the final decision.","ja":"最終決定は今マリノス次第だ。","chunks":[642]},{"id":643,"en":"**Your guess is as good as mine** about the manager's mood tomorrow.","ja":"明日の管理者の機嫌については私にもわからないよ。","chunks":[643]},{"id":644,"en":"**It's the thought that counts**, even if Sae's gift was small.","ja":"咲英のプレゼントが小さくても、大切なのは気持ちだ。","chunks":[644]},{"id":645,"en":"\"**Why didn't you say so?**\" I asked Toyo-chan about the golf plan change.","ja":"ゴルフの予定変更について「どうして早く言ってくれなかったの？」ととよちゃんに聞いた。","chunks":[645]},{"id":646,"en":"**You only live once**, so let's try that expensive golf course.","ja":"人生は一度きりだから、あの高いゴルフコースに挑戦しよう。","chunks":[646]},{"id":647,"en":"**To each their own** when it comes to golf clubs or fishing rods.","ja":"ゴルフクラブか釣り竿か、人それぞれの好みだ。","chunks":[647]},{"id":648,"en":"**Ignorance is bliss** about how much that golf trip actually cost.","ja":"あのゴルフ旅行が実際いくらかかったか知らぬが仏だ。","chunks":[648]},{"id":649,"en":"**When in Rome**, we tried the local festival food without question.","ja":"郷に入っては郷に従えで、地元の祭りの食べ物を試した。","chunks":[649]},{"id":650,"en":"**Rome wasn't built in a day**, so my English is improving slowly.","ja":"ローマは一日にして成らず、私の英語も少しずつ上達している。","chunks":[650]},{"id":651,"en":"**There's no place like home** after a long business trip.","ja":"長い出張の後は、我が家が一番だ。","chunks":[651]},{"id":652,"en":"**Actions speak louder than words** when it comes to caring for Nutz.","ja":"ナッツの世話に関しては言葉より行動が大切だ。","chunks":[652]},{"id":653,"en":"**Life is what you make it**, so I keep learning English every day.","ja":"人生は自分で作るものだから、毎日英語学習を続けている。","chunks":[653]},{"id":654,"en":"**What goes around comes around**, so I try to be kind to my staff.","ja":"因果応報だから、スタッフには優しくするようにしている。","chunks":[654]},{"id":655,"en":"**Fake it until you make it** helped me speak English with confidence.","ja":"うまくいくまでフリをすることが、自信を持って英語を話す助けになった。","chunks":[655]},{"id":656,"en":"**Out of sight, out of mind**, so I keep golf clubs where I can see them.","ja":"目に入らないと忘れるから、ゴルフクラブは見える場所に置いている。","chunks":[656]},{"id":657,"en":"Learning basic golf swing tips **is not rocket science**.","ja":"基本的なゴルフのスイングのコツを学ぶのはそれほど難しくない。","chunks":[657]},{"id":658,"en":"**You snooze, you lose**, so I booked the golf tee time early.","ja":"油断すると機会を逃すから、ゴルフのスタート時間を早く予約した。","chunks":[658]},{"id":659,"en":"**You are what you eat**, so I try to eat healthy before golf.","ja":"食べる物が人を作るから、ゴルフの前は健康的なものを食べるようにしている。","chunks":[659]},{"id":660,"en":"**Easy come, easy go**, that's how it felt with the festival prize money.","ja":"簡単に手に入るものは簡単に失う、祭りの賞金はまさにそんな感じだった。","chunks":[660]},{"id":661,"en":"The manager wanted **an eye for an eye** after the small mistake.","ja":"その管理者は小さなミスに対して目には目をという態度だった。","chunks":[661]},{"id":662,"en":"I try not to **put all my eggs in one basket** with investments.","ja":"投資では一つのことに全てを賭けないようにしている。","chunks":[662]},{"id":663,"en":"**A picture is worth a thousand words**, so I took many photos at the event.","ja":"百聞は一見にしかずだから、イベントでたくさん写真を撮った。","chunks":[663]},{"id":664,"en":"**There's no use crying over spilled milk** about the rained-out golf round.","ja":"雨で流れたゴルフのラウンドについて、くよくよしても仕方ない。","chunks":[664]},{"id":665,"en":"That young athlete is truly a **diamond in the rough**.","ja":"あの若い選手はまさに磨けば光る原石だ。","chunks":[665]},{"id":666,"en":"I **was in two minds** about speaking to the manager again.","ja":"もう一度その管理者に話しかけるべきか迷っていた。","chunks":[666]},{"id":667,"en":"**Speak of the devil**, the manager just called me.","ja":"うわさをすれば、ちょうどその管理者から電話が来た。","chunks":[667]},{"id":668,"en":"\"**I wasn't born yesterday**,\" I told the salesman about the golf clubs.","ja":"ゴルフクラブの件でセールスマンに「馬鹿にしないで」と言った。","chunks":[668]},{"id":669,"en":"\"**Whatever floats your boat**,\" I said about Toyo-chan's new hobby.","ja":"とよちゃんの新しい趣味について「好きなようにやりなよ」と言った。","chunks":[669]},{"id":670,"en":"Toyo-chan stayed **as cool as a cucumber** when it started raining.","ja":"雨が降り始めても、とよちゃんはとても冷静だった。","chunks":[670]},{"id":671,"en":"I **was on the fence** about joining the extra golf tournament.","ja":"追加のゴルフ大会に参加するかどうか決めかねていた。","chunks":[671]},{"id":672,"en":"The manager kept **beating around the bush** instead of explaining clearly.","ja":"その管理者ははっきり説明せず、遠回しに言い続けた。","chunks":[672]},{"id":673,"en":"We **left no stone unturned** looking for the missing golf ball.","ja":"なくなったゴルフボールを探すためにあらゆる手を尽くした。","chunks":[673]},{"id":674,"en":"The stray cat seemed to **disappear without a trace** after summer.","ja":"野良猫は夏の後、跡形もなく姿を消したようだった。","chunks":[674]},{"id":675,"en":"The rain **added insult to injury** after our bad golf round.","ja":"悪いゴルフのラウンドの後、雨がさらに追い打ちをかけた。","chunks":[675]},{"id":676,"en":"I felt like I was **preaching to the choir** explaining golf rules to Toyo-chan.","ja":"ゴルフのルールをとよちゃんに説明するのは釈迦に説法のようだった。","chunks":[676]},{"id":677,"en":"I **had a lump in my throat** watching Sae leave for the airport.","ja":"咲英が空港へ向かうのを見て胸がいっぱいになった。","chunks":[677]},{"id":678,"en":"Buying used golf clubs **gets you more bang for your buck**.","ja":"中古のゴルフクラブを買う方がコスパがいい。","chunks":[678]},{"id":679,"en":"**How the tables have turned** since Toyo-chan started beating me at golf.","ja":"とよちゃんがゴルフで私に勝つようになって、立場が入れ替わった。","chunks":[679]},{"id":680,"en":"**It takes two to tango**, so we both apologized after the argument.","ja":"お互い様だから、言い争いの後は二人とも謝った。","chunks":[680]},{"id":681,"en":"**It's not my first rodeo** handling a difficult stadium manager.","ja":"難しい競技場の管理者への対応は初めてじゃない。","chunks":[681]},{"id":682,"en":"The strict manager had a **my way or the highway** attitude.","ja":"その厳しい管理者は自分に従わないなら出て行けという態度だった。","chunks":[682]},{"id":683,"en":"Accepting the manager's apology was a **bitter pill to swallow** at first.","ja":"その管理者の謝罪を受け入れるのは最初は辛かった。","chunks":[683]},{"id":684,"en":"The paperwork backlog is **the bane of my existence** this month.","ja":"今月は溜まった書類が悩みの種だ。","chunks":[684]},{"id":685,"en":"My golf score today was **nothing to write home about**.","ja":"今日のゴルフスコアは大したことなかった。","chunks":[685]},{"id":686,"en":"I think the manager was **barking up the wrong tree** with his complaint.","ja":"その管理者の苦情は見当違いだったと思う。","chunks":[686]},{"id":687,"en":"The Marinos hotel proposal went **back to the drawing board**.","ja":"マリノスへのホテル提案は振り出しに戻った。","chunks":[687]},{"id":688,"en":"This event finally **got our sports section one foot in the door** with Marinos.","ja":"このイベントでスポーツ振興課はやっとマリノスとの最初の1歩を踏み出せた。","chunks":[688]},{"id":689,"en":"The staff worked **like their life depends on it** during the festival.","ja":"スタッフは祭りの間、命懸けのように働いた。","chunks":[689]},{"id":690,"en":"**On the other side of the coin**, the rain kept the crowd smaller.","ja":"その一方で、雨のおかげで人出は少なめだった。","chunks":[690]},{"id":691,"en":"This project feels like **one step forward, two steps back** lately.","ja":"最近このプロジェクトは1歩進んで2歩下がる感じだ。","chunks":[691]},{"id":692,"en":"The manager finally **got a taste of his own medicine** from his boss.","ja":"その管理者はついに自分の上司からしっぺ返しを受けた。","chunks":[692]},{"id":693,"en":"Toyo-chan really **hit the nail on the head** about my golf mistake.","ja":"とよちゃんは私のゴルフのミスについてまさに核心をついた。","chunks":[693]},{"id":694,"en":"The manager **kept his cards close to his chest** about the schedule.","ja":"その管理者はスケジュールについて手の内を見せなかった。","chunks":[694]},{"id":695,"en":"\"**It takes one to know one**,\" I joked with Toyo-chan about being stubborn.","ja":"頑固さについて「お互い様だよ」ととよちゃんに冗談を言った。","chunks":[695]},{"id":696,"en":"The manager's advice **went in one ear and out the other** for me.","ja":"その管理者のアドバイスは右から左へ聞き流してしまった。","chunks":[696]},{"id":697,"en":"I **take the manager's complaints with a pinch of salt** now.","ja":"今ではその管理者の苦情は話半分に聞いている。","chunks":[697]},{"id":698,"en":"You can't **have your cake and eat it too** with golf and family time.","ja":"ゴルフと家族の時間、両方のいいとこ取りはできない。","chunks":[698]},{"id":699,"en":"I **couldn't make heads or tails of the new tax rule** at first.","ja":"最初、その新しい税制のルールはさっぱり理解できなかった。","chunks":[699]},{"id":700,"en":"I'll **cross that bridge when I come to it** about the Marinos budget.","ja":"マリノスの予算についてはそのときが来たら考えよう。","chunks":[700]},{"id":701,"en":"I always **ask after** Toyo-chan's parents when I see them, and I **ask around** for a good golf coach.","ja":"とよちゃんの両親に会うといつも様子を尋ねるし、良いゴルフコーチを聞いて回っている。","chunks":[701,702]},{"id":702,"en":"I had to **ask for** a new golf glove, since mine wore out.","ja":"手袋が擦り切れたので新しいゴルフグローブを求めた。","chunks":[703]},{"id":703,"en":"We **asked Sae's friend in** to wait while Sae got ready.","ja":"咲英の準備ができるまで、彼女の友人を家に呼び入れた。","chunks":[704]},{"id":704,"en":"A colleague **asked me out** for lunch to talk about the Marinos plan.","ja":"同僚がマリノスの計画について話すため昼食に誘ってくれた。","chunks":[705]},{"id":705,"en":"We **asked the neighbors over** for a Jingisukan party.","ja":"ジンギスカンパーティーのため近所の人を家に呼んだ。","chunks":[706]},{"id":706,"en":"Nutz began to **back away** when the vacuum cleaner turned on.","ja":"掃除機が動くとナッツは後ずさりし始めた。","chunks":[707]},{"id":707,"en":"The manager finally had to **back down** after the mayor stepped in.","ja":"市長が介入した後、その管理者はついに身を引いた。","chunks":[708]},{"id":708,"en":"I accidentally **backed into** the golf cart in the parking lot.","ja":"駐車場でうっかりゴルフカートにバックでぶつけてしまった。","chunks":[709]},{"id":709,"en":"I told the angry driver to **back off** from the stadium gate.","ja":"怒っている運転手に競技場のゲートから引き下がるよう言った。","chunks":[710]},{"id":710,"en":"I had to **back out** of the tight parking space carefully.","ja":"狭い駐車スペースから慎重にバックで出さなければならなかった。","chunks":[711]},{"id":711,"en":"I almost **backed over** Nutz's toy in the driveway.","ja":"私道でナッツのおもちゃをバックで轢きそうになった。","chunks":[712]},{"id":712,"en":"Toyo-chan's story really **backs up** my point about the manager.","ja":"とよちゃんの話は管理者についての私の主張を裏付けている。","chunks":[713]},{"id":713,"en":"Sae's smile always **blows me away** with joy.","ja":"咲英の笑顔はいつも私を感動させる。","chunks":[714]},{"id":714,"en":"The strong wind **blew down** a tree near the golf course.","ja":"強風がゴルフ場の近くの木を吹き倒した。","chunks":[715]},{"id":715,"en":"An old friend just **blew in** for a surprise visit last weekend.","ja":"先週末、昔の友人がひょっこり現れた。","chunks":[716]},{"id":716,"en":"I decided to **blow off** the extra meeting to walk Nutz instead.","ja":"追加の会議をサボってナッツを散歩させることにした。","chunks":[717]},{"id":717,"en":"The wind will **blow through** the golf course tomorrow, so I need to plan my shots carefully.","ja":"明日はゴルフ場に風が吹き抜けるので、ショットを慎重に計画する必要がある。","chunks":[718]},{"id":718,"en":"The birthday balloon slowly began to **blow up** at the party.","ja":"パーティーで誕生日の風船がゆっくり膨らみ始めた。","chunks":[719]},{"id":719,"en":"My old golf cart finally **broke down** last week.","ja":"私の古いゴルフカートが先週ついに故障した。","chunks":[720]},{"id":720,"en":"Toyo-chan started to **break down** in tears after the good news.","ja":"良い知らせを聞いて、とよちゃんは涙を流し始めた。","chunks":[720]},{"id":721,"en":"Someone tried to **break in** to the stadium storage room last night.","ja":"昨夜、誰かが競技場の倉庫に押し入ろうとした。","chunks":[721]},{"id":722,"en":"It takes time to **break in** a new pair of golf shoes.","ja":"新しいゴルフシューズを履き慣らすには時間がかかる。","chunks":[721]},{"id":723,"en":"Marinos wants to **break into** the Japanese sports tourism market.","ja":"マリノスは日本のスポーツツーリズム市場に参入したいと考えている。","chunks":[722]},{"id":724,"en":"I had to **break off** a branch blocking the golf path.","ja":"ゴルフの道をふさぐ枝を折り取らなければならなかった。"," const STORAGE_KEY = 'chunk_progress_v1';
const INTERVALS = [1, 3, 7, 14, 30, 90]; // days

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const initial = {};
  CHUNKS.forEach(c => {
    initial[c.id] = { status: '未学習', review_count: 0, last_reviewed: null, next_review: null, box: 0 };
  });
  return initial;
}

function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function setupSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'en-US';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 4;
  return r;
}

function toggleMic() {
  const transcriptEl = document.getElementById('transcript');
  if (!recognition) {
    recognition = setupSpeechRecognition();
    if (!recognition) {
      transcriptEl.style.display = 'block';
      transcriptEl.innerHTML = 'この端末・ブラウザは音声入力に対応していません（テキストで確認してください）';
      return;
    }
    recognition.onresult = (event) => {
      const lastResult = event.results[event.results.length - 1];
      const alternatives = [];
      for (let i = 0; i < lastResult.length; i++) {
        alternatives.push(lastResult[i].transcript);
      }
      transcriptEl.style.display = 'block';
      if (alternatives.length <= 1) {
        transcriptEl.innerHTML = '🗣️ ' + alternatives[0];
      } else {
        const list = alternatives.map((a, i) =>
          `<div style="padding:4px 0; ${i===0 ? 'font-weight:700;' : 'opacity:0.7; font-size:14px;'}">🗣️ ${a}</div>`
        ).join('');
        transcriptEl.innerHTML = list;
      }
    };
    recognition.onend = () => {
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micLabel').textContent = 'タップして英語で話す';
      // reveal answer + show judge buttons after speaking
      revealAnswer();
    };
    recognition.onerror = () => {
      listening = false;
      document.getElementById('micBtn').classList.remove('listening');
    };
  }
  if (listening) {
    recognition.stop();
  } else {
    document.getElementById('transcript').style.display = 'none';
    document.getElementById('transcript').textContent = '';
    listening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('micLabel').textContent = '聞き取り中… もう一度タップで終了';
    try { recognition.start(); } catch (e) {}
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function addDays(dateStr, days) {
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function buildQueue(mode) {
  const today = todayStr();
  if (mode === 'quiz') {
    // due for review: next_review <= today, or 未学習
    queue = CHUNKS.filter(c => {
      const p = progress[c.id];
      if (!p) return true;
      if (p.status === '未学習') return true;
      if (p.status === '習得済み') return false;
      return !p.next_review || p.next_review <= today;
    });
  } else {
    queue = [...CHUNKS];
  }
  // shuffle
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
}

function updateStats() {
  const counts = { '未学習': 0, '学習中': 0, '復習中': 0, '習得済み': 0 };
  Object.values(progress).forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
  document.getElementById('stats').innerHTML =
    `<span>未学習 ${counts['未学習']}</span><span>習得済み ${counts['習得済み']}</span><span>復習待ち ${queueDueCount()}</span>`;
}

function queueDueCount() {
  const today = todayStr();
  return CHUNKS.filter(c => {
    const p = progress[c.id];
    if (!p || p.status === '未学習') return true;
    if (p.status === '習得済み') return false;
    return !p.next_review || p.next_review <= today;
  }).length;
}

    area.innerHTML = `<div class="empty">🎉 今日の分は終わりました！<br>お疲れ様でした。</div>`;
    btns.style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';
    return;
  }
  currentCard = queue[0];
  cardAnswered = false;
  const p = progress[currentCard.id] || { status: '未学習', box: 0 };

  const exIds = CHUNK_TO_EXAMPLES[currentCard.id] || [];
  const hasExamples = exIds.length > 0;
  const example = hasExamples ? EXAMPLE_MAP[exIds[0]] : null;

  const chunkFront = direction === 'ja2en' ? currentCard.ja : currentCard.en;
  const chunkBack = direction === 'ja2en' ? currentCard.en : currentCard.ja;
  const exampleFrontHtml = example ? (direction === 'ja2en' ? example.ja : mdBoldToHtml(example.en)) : '';
  const exampleBackHtml = example ? (direction === 'ja2en' ? mdBoldToHtml(example.en) : example.ja) : '';

  area.innerHTML = `
    <div class="no-badge">No.${currentCard.id} ・ ${p.status}</div>
    <div class="card" id="flashcard">
      <div class="quiz-chunk">${chunkFront}</div>
      <div class="quiz-chunk-ja" id="chunkJa" style="display:none;">${chunkBack}</div>
      ${example ? `<div class="quiz-sep"></div><div class="quiz-example">${exampleFrontHtml}</div><div class="quiz-example-ja" id="exampleJa" style="display:none;">${exampleBackHtml}</div>` : ''}
    </div>
  `;
  btns.style.display = 'flex';
  btns.innerHTML = `
    <button class="btn btn-wrong" id="btnWrong">😵 わからない</button>
    <button class="btn btn-correct" id="btnCorrect">✅ わかった</button>
  `;
  document.getElementById('btnCorrect').onclick = () => markResult(true);
  document.getElementById('btnWrong').onclick = () => markResult(false);

  const total = currentTab === 'quiz' ? queueDueCount() : CHUNKS.length;
  const remaining = queue.length;
  const done = total - remaining;
  document.getElementById('progressFill').style.width = `${total ? (done/total*100) : 0}%`;
}

function markResult(correct) {
  if (!currentCard || cardAnswered) return;
  cardAnswered = true;
  const p = progress[currentCard.id] || { status: '未学習', review_count: 0, box: 0 };
  p.review_count = (p.review_count || 0) + 1;
  p.last_reviewed = todayStr();
  if (correct) {
    p.box = Math.min((p.box || 0) + 1, INTERVALS.length - 1);
    p.status = p.box >= INTERVALS.length - 1 ? '習得済み' : (p.box >= 2 ? '復習中' : '学習中');
    p.next_review = addDays(todayStr(), INTERVALS[p.box]);
  } else {
    p.box = 0;
    p.status = '学習中';
    p.next_review = addDays(todayStr(), INTERVALS[0]);
  }
  progress[currentCard.id] = p;
  saveProgress(progress);
  updateStats();

  // Reveal Japanese translations for both chunk and example
  const chunkJaEl = document.getElementById('chunkJa');
  const exampleJaEl = document.getElementById('exampleJa');
  if (chunkJaEl) chunkJaEl.style.display = 'block';
  if (exampleJaEl) exampleJaEl.style.display = 'block';

  // Replace buttons with a single "next" button
  const btns = document.getElementById('quizButtons');
  btns.innerHTML = `<button class="btn btn-next" id="btnNextCard" style="width:100%;">次へ →</button>`;
  document.getElementById('btnNextCard').onclick = () => {
    queue.shift();
    renderCard();
  };
}

function renderList() {
  const area = document.getElementById('listArea');
  let rows = CHUNKS.map(c => {
    const p = progress[c.id] || { status: '未学習', review_count: 0 };
    return `<tr data-chunk="${c.id}"><td>${c.id}</td><td>${c.en}</td><td>${c.ja}</td><td><span class="status-badge st-${p.status}">${p.status}</span></td></tr>`;
  }).join('');
  area.innerHTML = `<table class="list"><thead><tr><th>No</th><th>チャンク</th><th>意味</th><th>状態</th></tr></thead><tbody>${rows}</tbody></table>`;
  area.querySelectorAll('tr[data-chunk]').forEach(tr => {
    tr.addEventListener('click', () => openChunkDetail(parseInt(tr.dataset.chunk, 10)));
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const quizArea = document.getElementById('quizArea');
  const quizButtons = document.getElementById('quizButtons');
  const listArea = document.getElementById('listArea');
  const progressBar = document.querySelector('.progress-bar');
  const micWrap = document.getElementById('micWrap');
  const dirToggle = document.getElementById('dirToggle');

  if (tab === 'list') {
    quizArea.style.display = 'none';
    quizButtons.style.display = 'none';
    progressBar.style.display = 'none';
    micWrap.style.display = 'none';
    dirToggle.style.display = 'none';
    listArea.style.display = 'block';
    renderList();
  } else if (tab === 'example') {
    dirToggle.style.display = 'none';
    quizButtons.style.display = 'none';
    micWrap.style.display = 'none';
    listArea.style.display = 'none';
    quizArea.style.display = 'flex';
    progressBar.style.display = 'block';
    renderExample();
  } else {
    dirToggle.style.display = 'flex';
    quizArea.style.display = 'flex';
    listArea.style.display = 'none';
    progressBar.style.display = 'block';
    restoreQuizButtons();
    buildQueue(tab === 'quiz' ? 'quiz' : 'random');
    renderCard();
    updateStats();
  }
}

function renderExample() {
  const area = document.getElementById('quizArea');
  exampleRevealed = false;
  const ex = EXAMPLES[exampleIndex];
  if (!ex) return;
  const badges = ex.chunks.map(cid => {
    const c = CHUNK_MAP[cid];
    return `<span class="chunk-badge" data-chunk="${cid}">#${cid} ${c ? c.en : ''}</span>`;
  }).join('');
  area.innerHTML = `
    <div class="no-badge">例文 No.${ex.id} （${exampleIndex + 1} / ${EXAMPLES.length}）</div>
    <div class="card" id="exampleCard">
      <div class="en">${mdBoldToHtml(ex.en)}</div>
      <div class="ja" id="exJaText" style="display:none;">${ex.ja}</div>
      <button class="reveal-btn" id="exHintText">👀 タップして日本語訳を表示</button>
      <div class="chunk-badges">${badges}</div>
    </div>
  `;
  document.getElementById('exHintText').addEventListener('click', (e) => {
    e.stopPropagation();
    exampleRevealed = true;
    document.getElementById('exJaText').style.display = 'block';
    document.getElementById('exHintText').style.display = 'none';
  });
  area.querySelectorAll('.chunk-badge').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      openChunkDetail(parseInt(b.dataset.chunk, 10));
    });
  });
  const btns = document.getElementById('quizButtons');
  btns.style.display = 'flex';
  btns.innerHTML = `
    <button class="btn btn-prev" id="exPrevBtn" ${exampleIndex === 0 ? 'disabled' : ''}>← 前へ</button>
    <button class="btn btn-next" id="exNextBtn" ${exampleIndex >= EXAMPLES.length - 1 ? 'disabled' : ''}>次へ →</button>
  `;
  document.getElementById('exPrevBtn').onclick = () => { if (exampleIndex > 0) { exampleIndex--; renderExample(); } };
  document.getElementById('exNextBtn').onclick = () => { if (exampleIndex < EXAMPLES.length - 1) { exampleIndex++; renderExample(); } };
  document.getElementById('progressFill').style.width = `${((exampleIndex + 1) / EXAMPLES.length) * 100}%`;
}

function applyResult(chunkId, correct) {
  const p = progress[chunkId] || { status: '未学習', review_count: 0, box: 0 };
  p.review_count = (p.review_count || 0) + 1;
  p.last_reviewed = todayStr();
  if (correct) {
    p.box = Math.min((p.box || 0) + 1, INTERVALS.length - 1);
    p.status = p.box >= INTERVALS.length - 1 ? '習得済み' : (p.box >= 2 ? '復習中' : '学習中');
    p.next_review = addDays(todayStr(), INTERVALS[p.box]);
  } else {
    p.box = 0;
    p.status = '学習中';
    p.next_review = addDays(todayStr(), INTERVALS[0]);
  }
  progress[chunkId] = p;
  saveProgress(progress);
  updateStats();
}

function openChunkDetail(chunkId) {
  const c = CHUNK_MAP[chunkId];
  if (!c) return;
  const p = progress[chunkId] || { status: '未学習' };
  const relatedExampleIds = CHUNK_TO_EXAMPLES[chunkId] || [];
  const box = document.getElementById('detailBox');
  box.innerHTML = `
    <div class="no-badge">No.${c.id} <span class="status-badge st-${p.status}">${p.status}</span></div>
    <div class="en">${c.en}</div>
    <div class="ja">${c.ja}</div>
    <div class="detail-sep"></div>
    <div class="buttons" style="margin-top:0;">
      <button class="btn btn-wrong" id="detailWrong">😵 わからない</button>
      <button class="btn btn-correct" id="detailCorrect">✅ わかった</button>
    </div>
    ${relatedExampleIds.length ? `<button class="example-link" id="detailToExample" style="width:100%; margin-top:12px;">📖 この例文を見る</button>` : ''}
    <button class="detail-close" id="detailCloseBtn">閉じる</button>
  `;
  document.getElementById('detailWrong').onclick = () => { applyResult(chunkId, false); closeDetail(); refreshCurrentView(); };
  document.getElementById('detailCorrect').onclick = () => { applyResult(chunkId, true); closeDetail(); refreshCurrentView(); };
  document.getElementById('detailCloseBtn').onclick = closeDetail;
  if (relatedExampleIds.length) {
    document.getElementById('detailToExample').onclick = () => {
      closeDetail();
      const idx = EXAMPLES.findIndex(e => e.id === relatedExampleIds[0]);
      if (idx >= 0) {
        exampleIndex = idx;
        switchTab('example');
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'example'));
      }
    };
  }
  document.getElementById('detailModal').classList.add('show');
}

function openExamplesForChunk(chunkId) {
  const ids = CHUNK_TO_EXAMPLES[chunkId] || [];
  const box = document.getElementById('detailBox');
  if (ids.length === 0) {
    box.innerHTML = `<div class="ja">この チャンクを使った例文はまだありません。</div><button class="detail-close" id="detailCloseBtn">閉じる</button>`;
    document.getElementById('detailModal').classList.add('show');
    document.getElementById('detailCloseBtn').onclick = closeDetail;
    return;
  }
  const list = ids.map(eid => {
    const ex = EXAMPLE_MAP[eid];
    return `<div style="margin-bottom:14px;"><div class="en" style="font-size:16px;">${mdBoldToHtml(ex.en)}</div><div class="ja" style="font-size:14px;">${ex.ja}</div></div>`;
  }).join('<div class="detail-sep"></div>');
  box.innerHTML = `
    <div class="no-badge">No.${chunkId} の例文</div>
    ${list}
    <button class="detail-close" id="detailCloseBtn">閉じる</button>
  `;
  document.getElementById('detailCloseBtn').onclick = closeDetail;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}

function refreshCurrentView() {
  if (currentTab === 'example') { renderExample(); }
  else if (currentTab === 'list') { renderList(); }
  else { renderCard(); }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});
document.querySelectorAll('.dir-btn').forEach(b => {
  b.addEventListener('click', () => {
    direction = b.dataset.dir;
    document.querySelectorAll('.dir-btn').forEach(x => x.classList.toggle('active', x === b));
    if (currentTab === 'quiz' || currentTab === 'random') renderCard();
  });
});

function restoreQuizButtons() {
  const btns = document.getElementById('quizButtons');
  btns.innerHTML = `
    <button class="btn btn-wrong" id="btnWrong">😵 わからない</button>
    <button class="btn btn-correct" id="btnCorrect">✅ わかった</button>
  `;
  document.getElementById('btnCorrect').addEventListener('click', () => markResult(true));
  document.getElementById('btnWrong').addEventListener('click', () => markResult(false));
}
restoreQuizButtons();
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('本当に全ての学習進捗をリセットしますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    progress = loadProgress();
    switchTab(currentTab);
  }
});

function generateExportText() {
  const lines = [];
  lines.push('---- CHUNK PROGRESS EXPORT START ----');
  lines.push(`exported_at: ${new Date().toISOString()}`);
  CHUNKS.forEach(c => {
    const p = progress[c.id];
    if (p && (p.review_count > 0 || p.status !== '未学習')) {
      lines.push(`${c.id}	${p.status}	${p.review_count || 0}	${p.last_reviewed || ''}	${p.next_review || ''}`);
    }
  });
  lines.push('---- CHUNK PROGRESS EXPORT END ----');
  return lines.join('\n');
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const text = generateExportText();
  document.getElementById('exportText').value = text;
  document.getElementById('exportModal').classList.add('show');
});
document.getElementById('closeExportBtn').addEventListener('click', () => {
  document.getElementById('exportModal').classList.remove('show');
});
document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('exportText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try {
    navigator.clipboard.writeText(ta.value).then(() => {
      document.getElementById('copyBtn').textContent = 'コピーしました！';
      setTimeout(() => { document.getElementById('copyBtn').textContent = 'コピーする'; }, 1500);
    });
  } catch (e) {
    document.execCommand('copy');
  }
});

switchTab('quiz');
</script>
</body>
</html>
